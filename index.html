<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d47a1">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Testify CBT — Test Series</title>
<style>
:root{
  --bg:#eef2f7;--card:#fff;--text:#12203a;--muted:#5b6b85;--line:#dde4ee;
  --brand:#0d47a1;--brand-2:#1565c0;--brand-soft:#e7f0fb;--accent:#f57c00;
  --green:#17924f;--red:#d32f2f;--purple:#6a1b9a;--amber:#ef9a00;--grey:#c9d2df;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 8px 22px rgba(16,32,64,.07);
  --shadow-lg:0 18px 50px rgba(16,32,64,.2);
  --ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{--bg:#0c1524;--card:#141f33;--text:#e6ecf7;--muted:#93a3bd;--line:#23324b;
  --brand:#5b9bf3;--brand-2:#7cb2f7;--brand-soft:#16253e;--grey:#3a4a63;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.app{min-height:100%;display:flex;flex-direction:column}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;
  transition:transform .15s var(--ease),box-shadow .2s,background .2s,opacity .2s}
.btn:active{transform:scale(.965)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(13,71,161,.25)}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.btn.sm{padding:7px 12px;border-radius:9px;font-size:13px}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.2;pointer-events:none;animation:rip .55s var(--ease) forwards}
@keyframes rip{to{transform:scale(2.4);opacity:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:650}
.chip.mut{background:transparent;border:1px solid var(--line);color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,input[type=file],textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}
label>span.lb{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:4px}
.view{animation:enter .25s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---- dashboard shell ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:0 16px;height:58px;
  background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;box-shadow:0 2px 12px rgba(13,71,161,.25)}
.topbar .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px}
.logo{width:32px;height:32px;border-radius:9px;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:16px;font-weight:900}
.spacer{flex:1}
.navs{display:flex;gap:4px;padding:10px 16px 0;max-width:1220px;margin:0 auto;width:100%}
.nav{padding:9px 16px;border-radius:10px 10px 0 0;font-weight:650;font-size:14px;color:var(--muted)}
.nav.on{background:var(--card);color:var(--brand);box-shadow:0 -2px 10px rgba(16,32,64,.06)}
.wrap{width:100%;max-width:1220px;margin:0 auto;padding:16px 16px calc(30px + var(--safe-b))}
h1{font-size:21px;margin:2px 0 2px;letter-spacing:-.4px}
h2{font-size:15.5px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
.tcard{padding:15px;display:flex;flex-direction:column;gap:11px;transition:transform .2s var(--ease),box-shadow .25s}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.row{display:flex;align-items:center;gap:10px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.3px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:650;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.tblwrap{overflow:auto}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(8,16,32,.45)}
.modal .box{width:100%;max-width:540px;padding:20px;background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);animation:pop .28s var(--spring);max-height:88dvh;overflow:auto}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(12px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translate(-50%,20px);opacity:0;background:#10203c;color:#fff;
  padding:11px 17px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:90;transition:all .3s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.prog>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.bld-row{display:grid;grid-template-columns:44px 74px 1.1fr 86px 1.2fr 1.25fr 32px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bld-row img{width:70px;height:50px;object-fit:cover;object-position:top;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
@media (max-width:780px){.bld-row{grid-template-columns:40px 64px 1fr 1fr}.bld-row .ansc,.bld-row .chc{grid-column:1/5}}
.kr{display:grid;grid-template-columns:52px 58px 1fr 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.kr.flag{background:color-mix(in srgb,var(--amber) 13%,transparent)}
.kr input{padding:6px 9px;border-radius:8px}
/* ---- analysis ---- */
.anTabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 12px}
.anTabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:650;color:var(--muted);white-space:nowrap;border:1px solid transparent}
.tab.on{color:#fff;background:linear-gradient(180deg,var(--brand-2),var(--brand))}
.abar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;min-width:70px}
.abar>i{display:block;height:100%;border-radius:99px;transition:width .8s var(--ease)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-str{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.t-mid{background:color-mix(in srgb,var(--amber) 22%,transparent);color:#a06000}
.t-weak{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.t-nil{background:var(--line);color:var(--muted)}
.funnel{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fbox{padding:12px;border-radius:12px;border:1px solid var(--line);text-align:center;background:var(--card)}
.fbox b{display:block;font-size:21px;margin-top:3px}
.score{display:flex;align-items:center;gap:18px;padding:18px;border-radius:16px;background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;box-shadow:0 12px 34px rgba(13,71,161,.3);flex-wrap:wrap}
.score .big{font-size:40px;font-weight:800;line-height:1;letter-spacing:-1.4px}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));margin-top:14px}
.stat{padding:13px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:19px;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:#fff;width:0;transition:width .9s var(--ease)}
/* ================= NTA EXAM SKIN ================= */
.nta{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;color:#000;
  font:14px/1.45 Verdana,Arial,Helvetica,sans-serif;z-index:50}
.nta *{box-sizing:border-box}
.nta-top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#f1f1f1;border-bottom:1px solid #c8c8c8}
.nta-top .ex{font-weight:700;font-size:15px;color:#13334f}
.nta-sys{display:flex;align-items:center;gap:8px;font-size:12px}
.nta-bar2{display:flex;align-items:center;gap:10px;padding:5px 10px;background:#fff;border-bottom:1px solid #d9d9d9;flex-wrap:wrap}
.nta-time{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.nta-time .box{border:1px solid #9bb7d4;background:#eaf3fb;padding:5px 11px;border-radius:3px;font-weight:700;font-variant-numeric:tabular-nums;color:#0b3c66}
.nta-time .box.warn{background:#fdecea;border-color:#e9a29d;color:#b5241c;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.55}}
.nta-secbar{display:flex;align-items:stretch;gap:0;background:#fff;border-bottom:2px solid #1f6fb2;overflow-x:auto;scrollbar-width:none}
.nta-secbar::-webkit-scrollbar{display:none}
.nta-sec{padding:7px 15px;font-size:12.5px;font-weight:700;color:#1f6fb2;background:#e8f1f9;border:1px solid #cfe0ef;border-bottom:0;white-space:nowrap}
.nta-sec.on{background:#1f6fb2;color:#fff;border-color:#1f6fb2}
.nta-sub{padding:5px 10px;background:#fafafa;border-bottom:1px solid #e0e0e0;display:flex;gap:6px;overflow-x:auto}
.nta-subbtn{padding:5px 14px;font-size:12.5px;font-weight:700;border:1px solid #c6c6c6;background:#fff;border-radius:3px}
.nta-subbtn.on{background:#13334f;color:#fff;border-color:#13334f}
.nta-main{flex:1;display:flex;min-height:0}
.nta-q{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid #d5d5d5}
.nta-qhead{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#f7f7f7;border-bottom:1px solid #e2e2e2;flex-wrap:wrap;font-size:12.5px}
.nta-qhead b{font-size:14px}
.nta-mk{margin-left:auto;display:flex;gap:14px;font-size:12px}
.nta-mk .pos{color:#177245;font-weight:700}
.nta-mk .neg{color:#b5241c;font-weight:700}
.nta-scroll{flex:1;overflow:auto;padding:14px 16px;background:#fff}
.nta-img{border:1px solid #e6e6e6;background:#fff;max-width:940px}
.nta-img img{display:block;width:100%;height:auto;transform-origin:top left}
.nta-opts{margin:16px 0 8px;max-width:940px}
.nta-opt{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid transparent;border-radius:4px;width:100%;text-align:left;font-size:14px}
.nta-opt:hover{background:#f4f8fc}
.nta-opt.on{background:#e3f0fb;border-color:#9dc3e6}
.nta-radio{width:19px;height:19px;border-radius:50%;border:2px solid #7a7a7a;display:grid;place-items:center;flex:none}
.nta-opt.on .nta-radio{border-color:#1f6fb2}
.nta-opt.on .nta-radio::after{content:"";width:9px;height:9px;border-radius:50%;background:#1f6fb2}
.nta-num{max-width:420px}
.nta-numdisp{border:1px solid #9a9a9a;padding:10px 12px;font-size:20px;font-weight:700;min-height:44px;background:#fff;letter-spacing:1px}
.nta-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.nta-keys button{padding:11px 0;border:1px solid #b9b9b9;background:#f5f5f5;font-weight:700;border-radius:3px}
.nta-keys button:active{background:#dfe9f3}
.nta-foot{display:flex;gap:7px;padding:8px 10px calc(8px + var(--safe-b));background:#f1f1f1;border-top:1px solid #cfcfcf;flex-wrap:wrap}
.nbtn{padding:8px 13px;border:1px solid #9b9b9b;background:linear-gradient(180deg,#fff,#e9e9e9);border-radius:3px;font-size:12.5px;font-weight:700;color:#222}
.nbtn:active{transform:translateY(1px)}
.nbtn.green{background:linear-gradient(180deg,#3fbb6e,#17924f);border-color:#127a41;color:#fff}
.nbtn.blue{background:linear-gradient(180deg,#4e9ede,#1f6fb2);border-color:#1a5d95;color:#fff}
.nbtn.orange{background:linear-gradient(180deg,#f7a93d,#e07c00);border-color:#c86e00;color:#fff}
.nbtn.red{background:linear-gradient(180deg,#e85d52,#c62828);border-color:#a92020;color:#fff}
.nta-side{width:316px;background:#fff;display:flex;flex-direction:column;flex:none}
.nta-prof{display:flex;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #e0e0e0;background:#fafcff}
.nta-prof img,.nta-prof .ph{width:54px;height:60px;object-fit:cover;border:1px solid #c9c9c9;background:#e9eef5;display:grid;place-items:center;color:#7d8ea3;font-size:11px}
.nta-legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;padding:9px;font-size:11px;background:#f7f9fc;border-bottom:1px solid #e0e0e0}
.nta-legend div{display:flex;align-items:center;gap:6px}
.pmark{width:26px;height:26px;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;position:relative}
.p-nv{background:#d9d9d9;color:#222;border:1px solid #bdbdbd;border-radius:3px}
.p-na{background:#d32f2f;color:#fff;clip-path:polygon(0 30%,50% 0,100% 30%,100% 100%,0 100%)}
.p-a{background:#17924f;color:#fff;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
.p-m{background:#6a1b9a;color:#fff;border-radius:50%}
.p-am{background:#6a1b9a;color:#fff;border-radius:50%}
.p-am::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;background:#fff;color:#17924f;border-radius:50%;font-size:10px;display:grid;place-items:center;border:1px solid #17924f}
.nta-pal{flex:1;overflow:auto;padding:10px;background:#fff}
.nta-pal .ttl{background:#1f6fb2;color:#fff;font-size:12px;font-weight:700;padding:5px 8px;margin:-10px -10px 10px}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pbtn{aspect-ratio:1;font-size:12px;font-weight:700;display:grid;place-items:center;position:relative;transition:transform .13s var(--spring)}
.pbtn:active{transform:scale(.88)}
.pbtn.cur{outline:3px solid #ffb300;outline-offset:1px}
.nta-sidefoot{padding:9px;border-top:1px solid #e0e0e0;background:#f4f4f4;display:flex;gap:6px;flex-wrap:wrap}
.nta-menu{display:none}
@media (max-width:920px){
  .nta-side{position:fixed;inset:auto 0 0 0;width:auto;max-height:78dvh;border-top:2px solid #1f6fb2;
    transform:translateY(103%);transition:transform .32s var(--ease);z-index:60;box-shadow:0 -10px 40px rgba(0,0,0,.25);border-radius:12px 12px 0 0}
  .nta-side.open{transform:none}
  .pgrid{grid-template-columns:repeat(7,1fr)}
  .nta-menu{display:inline-flex}
  .nta-q{border-right:0}
}
.scrim{position:fixed;inset:0;background:rgba(6,12,24,.45);opacity:0;pointer-events:none;transition:opacity .28s;z-index:55}
.scrim.on{opacity:1;pointer-events:auto}
.calc{position:fixed;right:18px;bottom:18px;width:260px;background:#f7f7f7;border:1px solid #9b9b9b;border-radius:8px;box-shadow:var(--shadow-lg);z-index:75;display:none;color:#000}
.calc.on{display:block}
.calc .hd{background:#1f6fb2;color:#fff;font-size:12px;font-weight:700;padding:6px 9px;border-radius:7px 7px 0 0;display:flex;cursor:move}
.calc input{width:100%;border:1px solid #b5b5b5;padding:8px;font-size:16px;text-align:right;border-radius:0;background:#fff}
.calc .g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px}
.calc .g button{padding:9px 0;border:1px solid #bdbdbd;background:#fff;border-radius:4px;font-size:12.5px;font-weight:600}
.calc .g button:active{background:#e3eefa}
@media print{body{background:#fff}.noprint{display:none!important}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const buzz=n=>{try{navigator.vibrate?.(n||8)}catch{}};
const hhmmss=s=>{s=Math.max(0,Math.round(s));const h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s/60)%60).padStart(2,'0'),x=String(s%60).padStart(2,'0');return `${h}:${m}:${x}`};
const mmss=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}m ${s%60}s`};
const dmy=t=>new Date(t).toLocaleDateString('en-GB').replaceAll('/','-');
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.tab');if(!b)return;
  const r=b.getBoundingClientRect(),s=document.createElement('span');s.className='ripple';
  const d=Math.max(r.width,r.height);s.style.width=s.style.height=d+'px';
  s.style.left=(e.clientX-r.left-d/2)+'px';s.style.top=(e.clientY-r.top-d/2)+'px';
  b.appendChild(s);setTimeout(()=>s.remove(),560);},{passive:true});
if(localStorage.cbtTheme)document.documentElement.dataset.theme=localStorage.cbtTheme;
function toggleTheme(){const c=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=c;localStorage.cbtTheme=c;go(state.view,state.opts);}

/* ============ PWA ============ */
let installEvt=null;
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$$('[data-install]').forEach(b=>b.style.display='inline-flex');});
addEventListener('appinstalled',()=>{installEvt=null;toast('App installed 🎉');});

/* ============ profile ============ */
const PROF=()=>Object.assign({student:'Student',form:'',batch:'',cls:'Class 12',course:'JEE (Main+Advanced) Test Series',
  institute:'TESTIFY',session:'2026-2027',centre:'Home / Online',photo:''},JSON.parse(localStorage.cbtProfile||'{}'));
const setProf=p=>localStorage.cbtProfile=JSON.stringify(p);

/* ============ DB ============ */
const DB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('cbt-db',2);
    r.onupgradeneeded=ev=>{const d=r.result;
      if(!d.objectStoreNames.contains('tests'))d.createObjectStore('tests',{keyPath:'id'});
      if(!d.objectStoreNames.contains('images'))d.createObjectStore('images');
      if(!d.objectStoreNames.contains('attempts'))d.createObjectStore('attempts',{keyPath:'testId'});
      if(!d.objectStoreNames.contains('history'))d.createObjectStore('history',{keyPath:'id'});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=async(s,m,fn)=>{const d=await open();return new Promise((res,rej)=>{
    const t=d.transaction(s,m),rq=fn(t.objectStore(s));
    t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=()=>rej(t.error);});};
  return{put:(s,v,k)=>tx(s,'readwrite',st=>st.put(v,k)),get:(s,k)=>tx(s,'readonly',st=>st.get(k)),
    del:(s,k)=>tx(s,'readwrite',st=>st.delete(k)),all:s=>tx(s,'readonly',st=>st.getAll())};})();
const imgKey=(t,q)=>`${t}|${q}`;
const urlCache=new Map();
async function imgUrl(testId,qid){const k=imgKey(testId,qid);
  if(urlCache.has(k))return urlCache.get(k);

/* ============ PDF ============ */
let pdfjs;
async function getPdfjs(){if(!pdfjs){
  pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs';}
  return pdfjs;}
function trim(c){
  const ctx=c.getContext('2d'),{width:w,height:h}=c;let d;
  try{d=ctx.getImageData(0,0,w,h).data}catch{return c}
  const T=244;let top=h,bot=0,left=w,right=0;
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){const i=(y*w+x)*4;
    if(d[i]<T||d[i+1]<T||d[i+2]<T){if(y<top)top=y;if(y>bot)bot=y;if(x<left)left=x;if(x>right)right=x;}}
  if(bot<=top||right<=left)return c;
  const pad=14,x0=Math.max(0,left-pad),y0=Math.max(0,top-pad);
  const cw=Math.min(w-x0,right-left+pad*2),ch=Math.min(h-y0,bot-top+pad*2);
  const o=document.createElement('canvas');o.width=cw;o.height=ch;
  const g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cw,ch);g.drawImage(c,x0,y0,cw,ch,0,0,cw,ch);
  return o;}
async function pdfToPageBlobs(file,onP){
  const lib=await getPdfjs();
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];
  for(let i=1;i<=doc.numPages;i++){
    const page=await doc.getPage(i),base=page.getViewport({scale:1});
    const vp=page.getViewport({scale:Math.min(2.6,Math.max(1.4,1500/base.width))});
    const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
    const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    out.push(await new Promise(r=>trim(c).toBlob(r,'image/jpeg',.86)));
    onP?.(i,doc.numPages);await new Promise(r=>setTimeout(r));}
  return out;}
async function splitBlobAt(blob,ratio){
  const bmp=await createImageBitmap(blob),cut=Math.round(bmp.height*ratio);
  const mk=(y,hh)=>{const c=document.createElement('canvas');c.width=bmp.width;c.height=hh;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,hh);
    x.drawImage(bmp,0,y,bmp.width,hh,0,0,bmp.width,hh);
    return new Promise(r=>trim(c).toBlob(r,'image/jpeg',.86));};
  return[await mk(0,cut),await mk(cut,bmp.height-cut)];}

/* ============ OCR key ============ */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function getTesseract(){if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');return window.Tesseract;}
async function prepForOcr(blob){
  const bmp=await createImageBitmap(blob),sc=Math.min(3,Math.max(1,1700/bmp.width));
  const c=document.createElement('canvas');c.width=bmp.width*sc;c.height=bmp.height*sc;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];const v=g>176?255:g<110?0:g;p[i]=p[i+1]=p[i+2]=v;}
  x.putImageData(d,0,0);return new Promise(r=>c.toBlob(r,'image/png'));}
function parseKeyText(txt){
  const out=new Map();
  const clean=txt.replace(/[|_]/g,' ').replace(/[\u2013\u2014]/g,'-');
  const re=/(?:^|[\s(])[QO0]\s*\.?\s*(\d{1,3})\s*[).:\-]?\s+?[\(\[]?\s*([A-Da-d]|\d{1,4}(?:\.\d{1,3})?)\s*[\)\]]?(?=[\s.,)]|$)/g;
  let m;while((m=re.exec(clean))){const n=+m[1];if(n<1||n>500)continue;
    let v=m[2];if(/^[a-d]$/.test(v))v=v.toUpperCase();if(!out.has(n))out.set(n,v);}
  return out;}
function progressModal(t){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box" style="max-width:420px"><h2>${t}</h2><div class="prog"><i></i></div>
    <div class="hint" id="pmTxt" style="margin-top:10px">Starting…</div></div>`;
  document.body.appendChild(m);
  return{set:(s,f)=>{$('#pmTxt',m).textContent=s;m.querySelector('.prog>i').style.width=(f*100)+'%';},close:()=>m.remove()};}
async function scanKeyFiles(files){
  const blobs=[];
  for(const f of files) f.type==='application/pdf'?blobs.push(...await pdfToPageBlobs(f)):blobs.push(f);
  const pm=progressModal('Answer key padh raha hoon…');let text='';
  try{const T=await getTesseract();const w=await T.createWorker('eng');
    await w.setParameters({tessedit_char_whitelist:'QqOo0123456789ABCDabcd()[].,:;-/ ',preserve_interword_spaces:'1'});
    for(let i=0;i<blobs.length;i++){pm.set(`Page ${i+1} / ${blobs.length}…`,i/blobs.length);
      const{data}=await w.recognize(await prepForOcr(blobs[i]));text+='\n'+data.text;}
    await w.terminate();}finally{pm.close();}
  return parseKeyText(text);}
function keyReviewModal(draft,found,onApply){
  const m=document.createElement('div');m.className='modal';
  const rows=()=>{const off=+($('#krOff',m)?.value||0);
    return draft.questions.map(q=>{const v=found.get(q.no+off)??'';
      const isL=/^[A-D]$/.test(v),isN=v!==''&&!isL;
      const flag=v===''||(q.type==='mcq'&&isN)||(q.type==='num'&&isL);
      return `<div class="kr ${flag?'flag':''}"><b>Q${q.no}</b><span class="hint">${q.type==='mcq'?'MCQ':'Num'}</span>
        <span class="hint">${esc(q.subject||'')}</span><input type="text" data-k="${q.id}" value="${esc(v)}" placeholder="—"></div>`;}).join('');};
  m.innerHTML=`<div class="box" style="max-width:640px"><h2>Key detected: ${found.size} answers</h2>
    <div class="row" style="gap:12px;flex-wrap:wrap;margin-bottom:10px">
      <label class="hint">Offset <input type="number" id="krOff" value="0" style="width:74px"></label>
      <label class="row hint" style="gap:6px"><input type="checkbox" id="krType" checked style="width:auto">Key se type bhi set karo</label></div>
    <p class="hint">Yellow rows = shaq wali, seedha edit kar lo.</p>
    <div id="krList" style="max-height:44dvh;overflow:auto">${rows()}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="krOk">Apply key</button><button class="btn ghost" id="krNo">Cancel</button></div></div>`;
  document.body.appendChild(m);
  $('#krOff',m).oninput=()=>{$('#krList',m).innerHTML=rows();};
  $('#krNo',m).onclick=()=>m.remove();
  $('#krOk',m).onclick=()=>{const st=$('#krType',m).checked;

    $$('[data-k]',m).forEach(i=>{const q=draft.questions.find(x=>x.id===i.dataset.k);let v=i.value.trim().toUpperCase();
      if(!v)return;if(st)q.type=/^[A-D]$/.test(v)?'mcq':'num';
      if(q.type==='mcq'&&/^\d$/.test(v))v={'8':'B','0':'D','4':'A','6':'C','1':'A'}[v]||v;q.answer=v;});
    m.remove();onApply();};}

/* ============ model ============ */
const DEFAULT_PATTERN=[{subject:'Physics',count:25,mcq:20},{subject:'Chemistry',count:25,mcq:20},{subject:'Mathematics',count:25,mcq:20}];
function applyPattern(qs,pat){let i=0;
  pat.forEach(p=>{for(let k=0;k<p.count&&i<qs.length;k++,i++){qs[i].subject=p.subject;qs[i].type=k<p.mcq?'mcq':'num';}});
  for(;i<qs.length;i++){qs[i].subject=pat.at(-1)?.subject||'General';qs[i].type='mcq';}
  qs.forEach((q,n)=>q.no=n+1);return qs;}
const subjectsOf=t=>[...new Set(t.questions.map(q=>q.subject))];
const idxOf=(t,id)=>t.questions.findIndex(q=>q.id===id);

/* ============ router ============ */
const state={view:'home',opts:{}};
async function go(view,opts={}){state.view=view;state.opts=opts;
  window.scrollTo(0,0);
  if(view==='home')return renderHome();
  if(view==='reports')return renderReports();
  if(view==='builder')return renderBuilder(opts.test);
  if(view==='instructions')return renderInstructions(opts.testId);
  if(view==='exam')return renderExam(opts.testId);
  if(view==='result')return renderResult(opts.hid);
  if(view==='review')return renderReview(opts.hid,opts.index||0);}

  const hist=await DB.all('history');
  const live=await DB.all('attempts');
  const lmap=Object.fromEntries(live.map(a=>[a.testId,a]));
  const byTest={};hist.forEach(h=>(byTest[h.testId]??=[]).push(h));
  shell(`
    <h1>Computer-Based Test Series</h1>
    <p class="sub">Question paper PDF upload karo, answer key scan karo, NTA jaisa interface — result aur analysis ready.</p>
    <div class="row" style="margin-bottom:16px;flex-wrap:wrap">
      <button class="btn primary" data-new>＋ New test from PDF</button>
      <label class="btn soft" style="margin:0">Import .json<input type="file" accept="application/json" id="impFile" style="display:none"></label>

          <div class="row" style="flex-wrap:wrap;gap:6px">
            ${hs.length?`<span class="chip">Best ${best}/${t.questions.length*t.marks}</span><span class="chip mut">${hs.length} attempt${hs.length>1?'s':''}</span>`:`<span class="chip mut">Not attempted</span>`}
            ${lv?`<span class="chip" style="background:color-mix(in srgb,var(--amber) 20%,transparent);color:#a06000">Paused</span>`:''}
            ${noKey?`<span class="chip" style="background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)">${noKey} key missing</span>`:''}</div>
          ${hs.length?`<div class="hint">Last: ${dmy(hs[0].submittedAt)} · ${hs[0].result.score} marks · ${hs[0].result.accuracy}% acc</div>`:''}
          <div class="row" style="flex-wrap:wrap">
            <button class="btn primary sm" data-open="${t.id}">${lv?'Resume test':'Start test'}</button>
            ${hs.length?`<button class="btn sm" data-last="${hs[0].id}">Analysis</button>`:''}
            <button class="btn sm" data-edit="${t.id}">Edit</button>
            <div class="spacer"></div>
            <button class="btn ghost sm" data-exp="${t.id}">⤓</button>
            <button class="btn ghost sm" data-del="${t.id}" style="color:var(--red)">🗑</button></div></div>`}).join('')
      :`<div class="card empty">Abhi koi test nahi. <b>＋ New test from PDF</b> dabao.</div>`}
    </div>`,'home');
  $('#impFile').onchange=async e=>{const f=e.target.files[0];if(f)await importTest(f);};
  app.addEventListener('click',async e=>{
    if(e.target.closest('[data-new]'))return go('builder');
    const o=e.target.closest('[data-open]');
    if(o)return go(lmap[o.dataset.open]?'exam':'instructions',{testId:o.dataset.open});

        <select data-f="subject">${[...new Set([...pattern.map(p=>p.subject),q.subject])].filter(Boolean).map(s=>`<option ${s===q.subject?'selected':''}>${esc(s)}</option>`).join('')}</select>
        <select data-f="type"><option value="mcq" ${q.type==='mcq'?'selected':''}>MCQ</option><option value="num" ${q.type==='num'?'selected':''}>Num</option></select>
        <div class="chc"><input data-f="chapter" list="chBank" value="${esc(q.chapter||'')}" placeholder="Chapter"></div>
        <div class="ansc">${q.type==='mcq'?['A','B','C','D'].map(o=>`<button class="btn sm ${q.answer===o?'primary':''}" data-ans="${o}">${o}</button>`).join(' ')
          :`<input data-f="answer" value="${esc(q.answer||'')}" placeholder="e.g. 12">`}</div>
        <button class="btn ghost sm" data-split>✂</button></div>`).join('');
    for(const q of draft.questions){const im=host.querySelector(`[data-q="${q.id}"] img`);if(im)im.src=await thumb(q);}}
  $('#keyList').onclick=async e=>{
    const row=e.target.closest('[data-q]');if(!row)return;
    const q=draft.questions.find(x=>x.id===row.dataset.q);
    const a=e.target.closest('[data-ans]');
    if(a){q.answer=a.dataset.ans;buzz();drawKeys();return;}
    if(e.target.matches('[data-zoom]'))return lightbox(e.target.src);
    if(e.target.closest('[data-split]')){
      const blob=pending.get(q.id)||await DB.get('images',imgKey(draft.id,q.id));if(!blob)return;
      const ratio=await askSplit(URL.createObjectURL(blob));if(!ratio)return;
      const[a1,a2]=await splitBlobAt(blob,ratio);
      const nq={id:uid(),subject:q.subject,chapter:q.chapter,type:q.type,answer:''};
      pending.set(q.id,a1);pending.set(nq.id,a2);
      draft.questions.splice(idxOf(draft,q.id)+1,0,nq);
      draft.questions.forEach((x,i)=>x.no=i+1);drawKeys();toast('Page split');}};
  $('#keyList').onchange=e=>{const row=e.target.closest('[data-q]');if(!row)return;
    const q=draft.questions.find(x=>x.id===row.dataset.q),f=e.target.dataset.f;if(!f)return;
    q[f]=e.target.value;if(f==='type'){q.answer='';drawKeys();}};
  $('#bPdf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    const bar=$('#bProg');bar.style.display='block';$('#bStat').textContent='Rendering…';
    try{const blobs=await pdfToPageBlobs(f,(i,n)=>{bar.firstElementChild.style.width=(i/n*100)+'%';$('#bStat').textContent=`Page ${i}/${n}…`;});
      draft.questions=blobs.map((b,i)=>{const id=uid();pending.set(id,b);return{id,no:i+1,subject:'',chapter:'',type:'mcq',answer:''};});
      applyPattern(draft.questions,pattern);
      if(!$('#bName').value)$('#bName').value=f.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim();
      $('#bStat').textContent=`${blobs.length} questions imported.`;drawKeys();toast('PDF imported');}
    catch(err){console.error(err);$('#bStat').textContent='PDF error: '+err.message;}
    bar.style.display='none';};
  $('#bSave').onclick=async()=>{
    draft.name=$('#bName').value.trim()||'Untitled test';draft.paperType=$('#bType').value;
    draft.durationMin=+$('#bDur').value||180;draft.marks=+$('#bMarks').value||4;
    draft.neg=Math.abs(+$('#bNeg').value||0);draft.negNum=Math.abs(+$('#bNegN').value||0);
    if(!draft.questions.length)return toast('Pehle PDF upload karo');
    for(const[qid,blob]of pending)await DB.put('images',blob,imgKey(draft.id,qid));
    await DB.put('tests',draft);toast('Saved');go('home');};
  drawKeys();}
function lightbox(src){const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box" style="max-width:min(940px,96vw);padding:8px;background:#fff"><img src="${src}" style="width:100%;border-radius:10px"></div>`;
  m.onclick=()=>m.remove();document.body.appendChild(m);}
function askSplit(src){return new Promise(res=>{
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box" style="max-width:min(760px,96vw)"><h2>Doosra question jahan shuru ho, wahan click karo</h2>
    <div style="position:relative"><img src="${src}" id="spImg" style="width:100%;border-radius:10px;background:#fff">
    <div id="spLine" style="position:absolute;left:0;right:0;height:2px;background:var(--red);display:none"></div></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="spOk" disabled>Split here</button>
    <button class="btn ghost" id="spNo">Cancel</button></div></div>`;
  document.body.appendChild(m);let ratio=0;
  const img=$('#spImg',m),line=$('#spLine',m);
  img.onclick=ev=>{const r=img.getBoundingClientRect();ratio=(ev.clientY-r.top)/r.height;
    line.style.display='block';line.style.top=(ev.clientY-r.top)+'px';$('#spOk',m).disabled=false;};
  $('#spOk',m).onclick=()=>{m.remove();res(ratio);};
  $('#spNo',m).onclick=()=>{m.remove();res(0);};});}

/* ============ import/export ============ */
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportTest(id){
  const t=await DB.get('tests',id),imgs={};
  for(const q of t.questions)imgs[q.id]=await b64(await DB.get('images',imgKey(id,q.id)));
  dl(new Blob([JSON.stringify({test:t,images:imgs})],{type:'application/json'}),`${t.name.replace(/\s+/g,'-')}.cbt.json`);
  toast('Exported');}
async function importTest(f){
  const data=typeof f==='string'?JSON.parse(f):JSON.parse(await f.text());
  const t=data.test;t.id=t.id||uid();
  for(const[qid,durl]of Object.entries(data.images||{}))await DB.put('images',await(await fetch(durl)).blob(),imgKey(t.id,qid));
  await DB.put('tests',t);toast('Imported');renderHome();}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);}

  buildCalc();

  function bump(){const n=Date.now();if(lastTick){const q=cur();at.timeSpent[q.id]=(at.timeSpent[q.id]||0)+(n-lastTick)/1000;}lastTick=n;}

  function summaryModal(){

      <div class="tblwrap"><table><thead><tr><th>Q</th><th>Subject</th><th>Section</th><th>Status</th><th>Time</th></tr></thead>

  async function finish(auto){
    bump();clearInterval(timerId);document.onkeydown=null;document.onvisibilitychange=null;
    const res=grade(t,at);
    const rec={id:uid(),testId:t.id,testName:t.name,paperType:t.paperType||'J(M)',mode:'CBT',

function buildCalc(){
  const keys=['sin','cos','tan','log','ln','(',')','^','√','π','7','8','9','/','C','4','5','6','*','⌫','1','2','3','-','=','0','.','e','+','±'];
  $('#calcG').innerHTML=keys.map(k=>`<button data-c="${k}">${k}</button>`).join('');
  const inp=$('#calcIn');
  $('#calcX').onclick=()=>$('#calc').classList.remove('on');
  $('#calcG').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;
    const k=b.dataset.c;let v=inp.value;
    if(k==='C')v='';
    else if(k==='⌫')v=v.slice(0,-1);
    else if(k==='±')v=v.startsWith('-')?v.slice(1):'-'+v;
    else if(k==='=')v=String(calcEval(v));
    else if(['sin','cos','tan','log','ln'].includes(k))v+=k+'(';
    else if(k==='√')v+='sqrt(';
    else v+=k;
    inp.value=v;};
  let drag=null;
  $('#calcHd').onpointerdown=e=>{const c=$('#calc');const r=c.getBoundingClientRect();
    drag={dx:e.clientX-r.left,dy:e.clientY-r.top};c.setPointerCapture?.(e.pointerId);};
  addEventListener('pointermove',e=>{if(!drag)return;const c=$('#calc');
    c.style.left=(e.clientX-drag.dx)+'px';c.style.top=(e.clientY-drag.dy)+'px';c.style.right='auto';c.style.bottom='auto';});
  addEventListener('pointerup',()=>drag=null);}
function calcEval(s){
  try{
    let e=s.replace(/π/g,'PI').replace(/(?<![a-z])e(?![a-z])/g,'E').replace(/\^/g,'**')
      .replace(/ln\(/g,'log(').replace(/log\(/g,'LOG10(').replace(/LOG10\(/g,'log10(');
    if(!/^[0-9+\-*/().,%\sA-Za-z_]*$/.test(e))return 'Error';
    const allowed=['sin','cos','tan','asin','acos','atan','sqrt','log','log10','abs','exp','PI','E','pow','round','floor','ceil'];
    const names=e.match(/[A-Za-z_]+/g)||[];
    if(names.some(n=>!allowed.includes(n)))return 'Error';
    const f=new Function('M',`with(M){return (${e})}`);
    const r=f(Math);return Number.isFinite(r)?+r.toPrecision(12):'Error';
  }catch{return 'Error';}}

/* ============ grading ============ */
const near=(a,b)=>Math.abs(parseFloat(a)-parseFloat(b))<=0.01;
function isCorrect(q,g){if(g==null||g==='')return false;
  if(q.type==='mcq')return String(g).toUpperCase()===String(q.answer||'').toUpperCase();
  return q.answer!==''&&!isNaN(parseFloat(q.answer))&&!isNaN(parseFloat(g))&&near(g,q.answer);}
function grade(t,at){
  const per={},perCh={},records=[];
  const ts=t.questions.map(q=>at.timeSpent[q.id]||0).filter(x=>x>2).sort((a,b)=>a-b);
  const med=ts.length?ts[Math.floor(ts.length/2)]:60;
  let score=0,correct=0,wrong=0,skipped=0;
  t.questions.forEach(q=>{
    const g=at.answers[q.id],tm=at.timeSpent[q.id]||0,ch=(q.chapter||'').trim()||'Unspecified';
    const negV=q.type==='mcq'?t.neg:(t.negNum??t.neg);
    const st=(g==null||g==='')?'skipped':isCorrect(q,g)?'correct':'wrong';
    const mk=st==='correct'?t.marks:st==='wrong'?-negV:0;score+=mk;
    if(st==='correct')correct++;else if(st==='wrong')wrong++;else skipped++;
    const slow=tm>Math.max(100,med*2),fast=tm<Math.max(20,med*0.45);
    const tag=st==='skipped'?(tm>25?'Attempted & left':'Not attempted')
      :st==='correct'?(slow?'Overtime correct':'Perfect attempt'):(fast?'Careless / guess':'Concept gap');
    const put=o=>{o.total++;o.time+=tm;o.score+=mk;o[st]++;o.max+=t.marks;};
    per[q.subject]??={score:0,max:0,correct:0,wrong:0,skipped:0,total:0,time:0};put(per[q.subject]);
    const ck=q.subject+' ▸ '+ch;
    perCh[ck]??={subject:q.subject,chapter:ch,score:0,max:0,correct:0,wrong:0,skipped:0,total:0,time:0};put(perCh[ck]);
    records.push({no:q.no,subject:q.subject,chapter:ch,type:q.type,status:st,time:tm,marks:mk,tag,given:g??'',answer:q.answer});});
  const attempted=correct+wrong;const tags={};records.forEach(r=>tags[r.tag]=(tags[r.tag]||0)+1);
  return{score,total:t.questions.length*t.marks,correct,wrong,skipped,attempted,
    accuracy:attempted?Math.round(correct/attempted*100):0,
    pct:+(score/(t.questions.length*t.marks)*100).toFixed(2),
    per,perCh,records,tags,negLost:records.filter(r=>r.status==='wrong').reduce((s,r)=>s-r.marks,0),
    median:med,timeUsed:Object.values(at.timeSpent).reduce((a,b)=>a+b,0)};}

  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(h.testName)} report</title>${RCSS}</head><body>

<script>
/* ---------- 1. THEME (jam fix) ---------- */
(function(){
  function apply(t){
    document.documentElement.setAttribute('data-theme',t);
    try{localStorage.setItem('theme',t);localStorage.setItem('tf_theme',t);}catch(e){}
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute('content',t==='dark'?'#070d18':'#0d47a1');
    document.querySelectorAll('.tf-theme-fab').forEach(b=>b.textContent=t==='dark'?'☀️':'🌙');
  }
  function cur(){return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';}
  window.tfToggleTheme=function(){apply(cur()==='dark'?'light':'dark');};
  function isBtn(el){
    if(!el)return null;
    var b=el.closest('#themeBtn,#themeToggle,[data-theme-toggle],[data-act="theme"],.theme-toggle,.theme-btn');
    if(b)return b;
    b=el.closest('button,a,label,div[role="button"]');if(!b)return null;
    var t=((b.getAttribute('aria-label')||'')+' '+(b.title||'')+' '+b.textContent).toLowerCase();
    return (/(dark|light)\s*mode|theme|🌙|☀|🌗/.test(t)&&b.textContent.length<40)?b:null;
  }
  document.addEventListener('click',function(e){
    var b=isBtn(e.target);
    if(b){e.preventDefault();e.stopImmediatePropagation();window.tfToggleTheme();}
  },true);
  var s=null;try{s=localStorage.getItem('theme')||localStorage.getItem('tf_theme');}catch(e){}
  apply(s||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
  setTimeout(function(){
    if([...document.querySelectorAll('button,a,label')].some(isBtn))return;
    var f=document.createElement('button');f.className='tf-theme-fab';f.title='Theme';
    f.textContent=cur()==='dark'?'☀️':'🌙';
    f.onclick=e=>{e.stopPropagation();window.tfToggleTheme();};
    document.body.appendChild(f);
  },1500);
})();

/* ---------- 2. MODAL CLOSE FIX ---------- */
(function(){
  var SEL='.modal,.sheet,.dialog,.drawer,.overlay,.popup,[role="dialog"],[aria-modal="true"]';
  function vis(el){if(!el||!el.isConnected)return false;var s=getComputedStyle(el);
    return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity>.05&&el.offsetHeight>40;}
  function open_(){return [...document.querySelectorAll(SEL)].filter(vis).filter(e=>!e.closest('.tf-ov'));}
  function hide(el){el.classList.remove('open','show','active','visible');el.setAttribute('hidden','');
    el.style.display='none';document.body.style.overflow='';document.documentElement.style.overflow='';}
  window.tfCloseModal=function(){
    var o=open_();if(!o.length)return false;var t=o[o.length-1];
    var b=t.querySelector('[data-close],.close,.btn-close,#closeBtn');
    if(b){b.click();setTimeout(()=>{if(vis(t))hide(t);},200);}else hide(t);
    return true;
  };
  document.addEventListener('keydown',e=>{if(e.key==='Escape')window.tfCloseModal();});
  function deco(){
    open_().forEach(function(m){
      if(m.querySelector(':scope > .tf-x'))return;
      if(getComputedStyle(m).position==='static')m.style.position='relative';
      var x=document.createElement('button');x.className='tf-x';x.type='button';x.innerHTML='✕';
      x.onclick=e=>{e.stopPropagation();window.tfCloseModal();};
      m.appendChild(x);
      m.addEventListener('mousedown',e=>{if(e.target===m)window.tfCloseModal();});
    });
  }
  new MutationObserver(deco).observe(document.body,{childList:true,subtree:true,
    attributes:true,attributeFilter:['class','style','hidden']});
  setInterval(deco,900);
})();

/* ---------- 3. CREDIT FOOTER (permanent) ---------- */
(function(){
  function mount(){
    if(document.querySelector('.tf-credit'))return;
    if(document.querySelector('.tf-ov'))return;
    var host=document.querySelector('#home,.home,.page.active,.screen.active,.app')||document.body;
    var f=document.createElement('footer');f.className='tf-credit';
    f.innerHTML='<div class="m">Designed &amp; developed by</div>'+

/* ---------- 5. AUTO-SPLIT PDF ON UPLOAD (no extra download) ---------- */
(function(){
  var PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';
  var JSPDF='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
  function load(src){return new Promise((r,j)=>{var s=document.createElement('script');
    s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s);});}

  function prog(){
    var d=document.createElement('div');d.className='tf-prog';
    d.innerHTML='<div id="tfPt">Preparing…</div><div class="bar"><i id="tfPb"></i></div>'+
      '<div style="font-size:12px;opacity:.7">Har question ko alag page par kaata ja raha hai</div>';
    document.body.appendChild(d);
    return {set:function(t,p){d.querySelector('#tfPt').textContent=t;
      d.querySelector('#tfPb').style.width=(p*100)+'%';},done:function(){d.remove();}};
  }
  function trim(cv){
    var c=cv.getContext('2d',{willReadFrequently:true});
    var d=c.getImageData(0,0,cv.width,cv.height).data;
    var top=0,bot=cv.height-1,left=0,right=cv.width-1;
    function rb(y){for(var x=0;x<cv.width;x+=3){var i=(y*cv.width+x)*4;
      if(d[i]<245||d[i+1]<245||d[i+2]<245)return false;}return true;}
    function cb(x){for(var y=0;y<cv.height;y+=3){var i=(y*cv.width+x)*4;
      if(d[i]<245||d[i+1]<245||d[i+2]<245)return false;}return true;}
    while(top<bot&&rb(top))top++;while(bot>top&&rb(bot))bot--;
    while(left<right&&cb(left))left++;while(right>left&&cb(right))right--;
    var pad=18,x=Math.max(0,left-pad),y=Math.max(0,top-pad);
    var w=Math.min(cv.width-x,right-left+pad*2),h=Math.min(cv.height-y,bot-top+pad*2);
    if(w<20||h<20)return cv;
    var o=document.createElement('canvas');o.width=w;o.height=h;
    var oc=o.getContext('2d');oc.fillStyle='#fff';oc.fillRect(0,0,w,h);
    oc.drawImage(cv,x,y,w,h,0,0,w,h);return o;
  }
  function stitch(parts){
    var w=Math.max.apply(null,parts.map(p=>p.cv.width));
    var h=parts.reduce((s,p)=>s+p.h,0)+24;
    var o=document.createElement('canvas');o.width=w;o.height=h;
    var c=o.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);
    var y=12;parts.forEach(p=>{c.drawImage(p.cv,0,p.y,p.cv.width,p.h,0,y,p.cv.width,p.h);y+=p.h;});
    return o;
  }
  async function splitFile(file){
    var P=prog();
    try{
      P.set('Engine load ho raha hai…',.03);
      var pdfjs=await import(PDFJS);
      pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs';
      var pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;
      var shots=[],cur=[],expect=1,started=false,scale=2.2;
      function flush(){if(!cur.length)return;var cv=trim(stitch(cur));
        if(cv.height>60)shots.push(cv.toDataURL('image/jpeg',.86));cur=[];}
      for(var p=1;p<=pdf.numPages;p++){
        P.set('Page '+p+'/'+pdf.numPages+' — questions: '+shots.length, p/pdf.numPages*.75);
        var page=await pdf.getPage(p),vp=page.getViewport({scale});
        var cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
        var ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
        await page.render({canvasContext:ctx,viewport:vp}).promise;
        var tc=await page.getTextContent(),marks=[];
        tc.items.forEach(function(it){
          var s=(it.str||'').trim();
          var m=s.match(/^(?:Q\s*\.?\s*|Question\s*)?(\d{1,3})\s*[.)\]]/i);
          if(!m)return;
          var n=parseInt(m[1],10);
          var tr=pdfjs.Util.transform(vp.transform,it.transform);
          var x=tr[4],y=tr[5]-Math.abs(tr[3]);
          if(x>vp.width*0.45)return;
          if(n!==expect)return;
          marks.push({y:Math.max(0,y-10)});expect++;
        });
        marks.sort((a,b)=>a.y-b.y);
        if(!marks.length){cur.push({cv:cv,y:0,h:cv.height});continue;}
        if(marks[0].y>30&&started)cur.push({cv:cv,y:0,h:marks[0].y});
        flush();started=true;
        for(var i=0;i<marks.length;i++){
          var end=i<marks.length-1?marks[i+1].y:cv.height;
          cur=[{cv:cv,y:marks[i].y,h:end-marks[i].y}];
          if(i<marks.length-1)flush();
        }
      }
      flush();
      if(shots.length<2){P.done();return null;}
      P.set('Naya PDF ban raha hai…',.85);
      if(!window.jspdf)await load(JSPDF);
      var jsPDF=window.jspdf.jsPDF,doc=null;
      for(var k=0;k<shots.length;k++){
        var img=new Image();img.src=shots[k];await img.decode();
        var W=img.naturalWidth,H=img.naturalHeight;
        if(!doc)doc=new jsPDF({unit:'px',format:[W,H],orientation:W>H?'l':'p'});
        else doc.addPage([W,H],W>H?'l':'p');
        doc.addImage(shots[k],'JPEG',0,0,W,H);
        P.set('PDF '+(k+1)+'/'+shots.length,.85+.15*(k/shots.length));
      }
      P.done();
      var blob=doc.output('blob');
      return new File([blob],file.name.replace(/\.pdf$/i,'')+'-split.pdf',{type:'application/pdf'});
    }catch(err){P.done();console.warn('split failed',err);return null;}
  }
  window.tfAutoSplit=true;   // band karna ho to console me: tfAutoSplit=false

  document.addEventListener('change',function(e){
    var inp=e.target;
    if(!inp||inp.tagName!=='INPUT'||inp.type!=='file')return;
    if(!window.tfAutoSplit)return;
    if(inp.dataset.tfDone==='1'){inp.dataset.tfDone='';return;}
    var f=inp.files&&inp.files[0];
    if(!f||!/pdf/i.test(f.type+f.name))return;
    var ctx=((inp.id||'')+' '+(inp.name||'')+' '+(inp.closest('label')?inp.closest('label').textContent:'')+' '+
      (inp.parentElement?inp.parentElement.textContent.slice(0,80):'')).toLowerCase();
    if(/key|answer|omr|solution|response/.test(ctx))return;   // answer key ko chhodo
    e.preventDefault();e.stopImmediatePropagation();
    splitFile(f).then(function(nf){
      var dt=new DataTransfer();dt.items.add(nf||f);
      inp.files=dt.files;inp.dataset.tfDone='1';
      inp.dispatchEvent(new Event('change',{bubbles:true}));
    });
  },true);
})();

(function(){
  var deg=true,expr='',ans=0;
  function fact(n){n=Math.round(n);if(n<0||n>170)return NaN;var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
  var T={sin:x=>Math.sin(deg?x*Math.PI/180:x),cos:x=>Math.cos(deg?x*Math.PI/180:x),
    tan:x=>Math.tan(deg?x*Math.PI/180:x),asin:x=>deg?Math.asin(x)*180/Math.PI:Math.asin(x),
    acos:x=>deg?Math.acos(x)*180/Math.PI:Math.acos(x),atan:x=>deg?Math.atan(x)*180/Math.PI:Math.atan(x)};
  function evl(s){
    s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'(Math.PI)')
       .replace(/%/g,'/100').replace(/\^/g,'**');
    s=s.replace(/(\d+(?:\.\d+)?)!/g,'fact($1)');
    s=s.replace(/\b(asin|acos|atan|sin|cos|tan)\(/g,'T.$1(')
       .replace(/\blog\(/g,'Math.log10(').replace(/\bln\(/g,'Math.log(')
       .replace(/√\(/g,'Math.sqrt(').replace(/\babs\(/g,'Math.abs(')
       .replace(/\bexp\(/g,'Math.exp(').replace(/\bAns\b/g,'('+ans+')')
       .replace(/\be\b/g,'(Math.E)');
    if(/[^0-9+\-*/().,\s A-Za-z_$]/.test(s))throw 0;
    return Function('T','fact','"use strict";return ('+s+')')(T,fact);
  }
  var box=document.createElement('div');
  box.className='tf-ov';box.id='tfCalc';box.style.display='none';
  box.innerHTML='<div class="tf-box" style="width:min(340px,100%)">'+

    '<div class="scr"><div class="e" id="tfE"></div><div class="r" id="tfR">0</div></div>'+
    '<div class="k">'+
    ['sin','cos','tan','log','ln','asin','acos','atan','√(','π',
     '7','8','9','÷','^','4','5','6','×','!',
     '1','2','3','−','(','0','.','Ans','+',')',
     'C','⌫','%','e','='].map(function(k){
      var cls=/[÷×−+^!%()√πe]|sin|cos|tan|log|ln|asin|acos|atan/.test(k)?'op':'';
      if(k==='=')cls='eq';
      return '<button class="'+cls+'" data-k="'+k+'">'+k+'</button>';}).join('')+
    '</div><button class="tf-b" id="tfCClose" style="width:100%;margin-top:10px">Close</button></div>';
  document.body.appendChild(box);
  var E=box.querySelector('#tfE'),R=box.querySelector('#tfR');
  function show(){E.textContent=expr;try{var v=evl(expr||'0');
    R.textContent=(typeof v==='number'&&isFinite(v))?(+v.toPrecision(12)):'';}catch(e){R.textContent='';}}
  box.addEventListener('click',function(e){
    var b=e.target.closest('button[data-k]');if(!b)return;
    var k=b.dataset.k;
    if(k==='C'){expr='';}
    else if(k==='⌫'){expr=expr.slice(0,-1);}
    else if(k==='='){try{var v=evl(expr);ans=v;R.textContent=+v.toPrecision(12);expr=String(+v.toPrecision(12));E.textContent='';return;}
      catch(err){R.textContent='Error';return;}}
    else if(/^(sin|cos|tan|asin|acos|atan|log|ln)$/.test(k)){expr+=k+'(';}
    else expr+=k;
    show();
  });
  box.querySelector('#tfDeg').onclick=function(){deg=!deg;this.textContent=deg?'DEG':'RAD';show();};
  box.querySelector('#tfCClose').onclick=()=>box.style.display='none';
  box.addEventListener('mousedown',e=>{if(e.target===box)box.style.display='none';});
  document.addEventListener('keydown',function(e){
    if(box.style.display==='none')return;
    if(/^[0-9.+\-*/()^%]$/.test(e.key)){expr+=e.key.replace('*','×').replace('/','÷');show();e.preventDefault();}
    else if(e.key==='Enter'){box.querySelector('[data-k="="]').click();e.preventDefault();}
    else if(e.key==='Backspace'){expr=expr.slice(0,-1);show();e.preventDefault();}
  });
  window.tfOpenCalc=function(){box.style.display='flex';show();};
  document.addEventListener('click',function(e){
    var b=e.target.closest('button,a,div[role="button"],.icon-btn');

(function(){
  function wipeLS(id){
    Object.keys(localStorage).forEach(function(k){
      if(!/attempt|result|history|score|report/i.test(k))return;
      try{
        var v=JSON.parse(localStorage.getItem(k));
        if(Array.isArray(v)){
          var n=v.filter(x=>String(x&&(x.id||x.attemptId||x.uid))!==String(id));
          if(n.length!==v.length)localStorage.setItem(k,JSON.stringify(n));
        }else if(v&&typeof v==='object'&&v[id]){delete v[id];localStorage.setItem(k,JSON.stringify(v));}
      }catch(e){}
    });
  }
  async function wipeIDB(id){
    if(!indexedDB.databases)return;
    var dbs=await indexedDB.databases();
    for(const d of dbs){
      if(!d.name)continue;
      await new Promise(res=>{
        var rq=indexedDB.open(d.name);
        rq.onsuccess=function(){
          var db=rq.result;
          var names=[...db.objectStoreNames].filter(n=>/attempt|result|history/i.test(n));
          if(!names.length){db.close();return res();}
          var tx=db.transaction(names,'readwrite');
          names.forEach(n=>{try{tx.objectStore(n).delete(id);
            tx.objectStore(n).delete(Number(id));}catch(e){}});
          tx.oncomplete=()=>{db.close();res();};
          tx.onerror=()=>{db.close();res();};
        };
        rq.onerror=()=>res();
      });
    }
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('button,a,.icon-btn,[data-del],[data-delete]');
    if(!b)return;
    var t=((b.getAttribute('aria-label')||'')+' '+(b.title||'')+' '+b.textContent).toLowerCase();
    var isDel=b.hasAttribute('data-del')||b.hasAttribute('data-delete')||
      (/delete|remove|🗑|✕ *attempt/.test(t)&&b.textContent.length<20);
    if(!isDel)return;
    var row=b.closest('[data-id],[data-attempt-id],[data-attempt],li,tr,.card,.item,.history-item');
    var id=b.dataset.id||b.dataset.del||b.dataset.delete||
      (row&&(row.dataset.id||row.dataset.attemptId||row.dataset.attempt));
    if(!id)return;
    if(!confirm('Is attempt ko delete karna hai? Ye wapas nahi aayega.'))
      {e.preventDefault();e.stopImmediatePropagation();return;}
    e.preventDefault();e.stopImmediatePropagation();
    if(row)row.style.opacity='.35';
    wipeLS(id);
    wipeIDB(id).then(function(){setTimeout(()=>location.reload(),250);});
  },true);
})();

  await sb.from('backups').upsert({user_id:user.id,data:payload,updated_at:new Date().toISOString()});
  if(!silent) alert('Cloud par save ho gaya ✔');
};
window.tfRestoreNow=async function(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) return alert('Pehle login karo');
  const {data}=await sb.from('backups').select('data').eq('user_id',user.id).single();
  if(!data||!data.data) return alert('Cloud par abhi koi backup nahi hai.');
  await restoreAll(data.data);
  alert('Data restore ho gaya. App reload ho rahi hai.');
  location.reload();
};

/* ---- login UI ---- */
function authUI(){
  const ov=document.createElement('div');ov.className='tf-ov';
  ov.innerHTML=`<div class="tf-box" style="width:min(400px,100%)">
    <button class="tf-x">✕</button>
    <h3 style="margin:0 0 4px">Testify Account</h3>
    <p style="margin:0 0 14px;color:var(--muted);font-size:13px">Login karne par tumhara poora data
      har device par wapas mil jayega.</p>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button class="tf-b" data-tab="pw" style="flex:1">Password</button>
      <button class="tf-b" data-tab="otp" style="flex:1">OTP</button>
    </div>
    <div id="paneP">
      <input class="tf-in" id="aEm" type="email" placeholder="Email">
      <input class="tf-in" id="aPw" type="password" placeholder="Password (min 6)">
      <div style="display:flex;gap:8px">
        <button class="tf-b p" id="aIn" style="flex:1">Login</button>
        <button class="tf-b" id="aUp" style="flex:1">Sign up</button>
      </div>
    </div>
    <div id="paneO" style="display:none">
      <input class="tf-in" id="oEm" type="email" placeholder="Email (OTP yahan aayega)">
      <button class="tf-b p" id="oSend" style="width:100%">Send OTP</button>
      <input class="tf-in" id="oCode" placeholder="6-digit code" style="margin-top:10px">
      <button class="tf-b" id="oVer" style="width:100%">Verify &amp; login</button>
    </div>
    <div id="aMsg" style="margin-top:12px;font-size:12.5px;color:var(--muted)"></div>
  </div>`;
  document.body.appendChild(ov);
  const q=s=>ov.querySelector(s), msg=t=>q('#aMsg').textContent=t;
  ov.querySelector('.tf-x').onclick=()=>ov.remove();
  ov.addEventListener('mousedown',e=>{if(e.target===ov)ov.remove();});
  ov.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    q('#paneP').style.display=b.dataset.tab==='pw'?'':'none';
    q('#paneO').style.display=b.dataset.tab==='otp'?'':'none';
  });
  q('#aUp').onclick=async()=>{
    msg('Account ban raha hai…');
    const {error}=await sb.auth.signUp({email:q('#aEm').value.trim(),password:q('#aPw').value});
    msg(error?('❌ '+error.message):'✔ Email par confirm link gaya hai. Confirm karke login karo.');
  };
  q('#aIn').onclick=async()=>{
    msg('Login ho raha hai…');
    const {error}=await sb.auth.signInWithPassword({email:q('#aEm').value.trim(),password:q('#aPw').value});
    if(error) return msg('❌ '+error.message);
    msg('✔ Login ho gaya. Data restore kar rahe hain…');
    await window.tfRestoreNow();
  };
  q('#oSend').onclick=async()=>{
    msg('OTP bhej rahe hain…');
    const {error}=await sb.auth.signInWithOtp({email:q('#oEm').value.trim()});
    msg(error?('❌ '+error.message):'✔ Email check karo, 6-digit code aaya hoga.');
  };
  q('#oVer').onclick=async()=>{
    msg('Verify ho raha hai…');
    const {error}=await sb.auth.verifyOtp({email:q('#oEm').value.trim(),token:q('#oCode').value.trim(),type:'email'});
    if(error) return msg('❌ '+error.message);
    msg('✔ Login ho gaya. Data restore kar rahe hain…');
    await window.tfRestoreNow();
  };
}
window.tfAuth=authUI;

/* account chip + auto backup */
const chip=document.createElement('button');
chip.className='tf-b';
chip.style.cssText='position:fixed;left:14px;bottom:calc(14px + var(--safe-b));z-index:99990;font-size:12.5px;border-radius:999px';
chip.textContent='👤 Login';
chip.onclick=async()=>{
  const {data:{user}}=await sb.auth.getUser();
  if(!user) return authUI();
  if(confirm('Logged in as '+user.email+'\n\nOK = cloud par backup\nCancel = logout')) window.tfBackupNow();
  else { await sb.auth.signOut(); chip.textContent='👤 Login'; }
};
document.body.appendChild(chip);
sb.auth.onAuthStateChange((_e,s)=>{ chip.textContent = s&&s.user ? '☁️ '+s.user.email.split('@')[0] : '👤 Login'; });
setInterval(()=>window.tfBackupNow(true), 120000);      // har 2 min auto-backup
window.addEventListener('beforeunload',()=>window.tfBackupNow(true));
</script>
