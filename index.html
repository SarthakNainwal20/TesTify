<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1730">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Testify CBT — Test Series</title>
<style>
:root{
  --bg:#eef2f7;--card:#fff;--text:#12203a;--muted:#5b6b85;--line:#dde4ee;
  --brand:#0d47a1;--brand-2:#1565c0;--brand-soft:#e7f0fb;--accent:#f57c00;
  --green:#17924f;--red:#d32f2f;--purple:#6a1b9a;--amber:#ef9a00;--grey:#c9d2df;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 8px 22px rgba(16,32,64,.07);
  --shadow-lg:0 18px 50px rgba(16,32,64,.2);
  --ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{--bg:#0c1524;--card:#141f33;--text:#e6ecf7;--muted:#93a3bd;--line:#23324b;
  --brand:#5b9bf3;--brand-2:#7cb2f7;--brand-soft:#16253e;--grey:#3a4a63;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.app{min-height:100%;display:flex;flex-direction:column}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;
  transition:transform .15s var(--ease),box-shadow .2s,background .2s,opacity .2s}
.btn:active{transform:scale(.965)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(13,71,161,.25)}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.btn.sm{padding:7px 12px;border-radius:9px;font-size:13px}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.2;pointer-events:none;animation:rip .55s var(--ease) forwards}
@keyframes rip{to{transform:scale(2.4);opacity:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:650}
.chip.mut{background:transparent;border:1px solid var(--line);color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,input[type=file],textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}
label>span.lb{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:4px}
.view{animation:enter .25s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---- dashboard shell ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:0 16px;height:58px;
  background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;box-shadow:0 2px 12px rgba(13,71,161,.25)}
.topbar .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px}
.logo{width:32px;height:32px;border-radius:9px;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:16px;font-weight:900}
.spacer{flex:1}
.navs{display:flex;gap:4px;padding:10px 16px 0;max-width:1220px;margin:0 auto;width:100%}
.nav{padding:9px 16px;border-radius:10px 10px 0 0;font-weight:650;font-size:14px;color:var(--muted)}
.nav.on{background:var(--card);color:var(--brand);box-shadow:0 -2px 10px rgba(16,32,64,.06)}
.wrap{width:100%;max-width:1220px;margin:0 auto;padding:16px 16px calc(30px + var(--safe-b))}
h1{font-size:21px;margin:2px 0 2px;letter-spacing:-.4px}
h2{font-size:15.5px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
.tcard{padding:15px;display:flex;flex-direction:column;gap:11px;transition:transform .2s var(--ease),box-shadow .25s}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.row{display:flex;align-items:center;gap:10px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.3px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:650;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.tblwrap{overflow:auto}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(8,16,32,.45)}
.modal .box{width:100%;max-width:540px;padding:20px;background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);animation:pop .28s var(--spring);max-height:88dvh;overflow:auto}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(12px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translate(-50%,20px);opacity:0;background:#10203c;color:#fff;
  padding:11px 17px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:90;transition:all .3s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.prog>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.bld-row{display:grid;grid-template-columns:44px 74px 1.1fr 86px 1.2fr 1.25fr 32px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bld-row img{width:70px;height:50px;object-fit:cover;object-position:top;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
@media (max-width:780px){.bld-row{grid-template-columns:40px 64px 1fr 1fr}.bld-row .ansc,.bld-row .chc{grid-column:1/5}}
.kr{display:grid;grid-template-columns:52px 58px 1fr 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.kr.flag{background:color-mix(in srgb,var(--amber) 13%,transparent)}
.kr input{padding:6px 9px;border-radius:8px}
/* ---- analysis ---- */
.anTabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 12px}
.anTabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:650;color:var(--muted);white-space:nowrap;border:1px solid transparent}
.tab.on{color:#fff;background:linear-gradient(180deg,var(--brand-2),var(--brand))}
.abar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;min-width:70px}
.abar>i{display:block;height:100%;border-radius:99px;transition:width .8s var(--ease)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-str{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.t-mid{background:color-mix(in srgb,var(--amber) 22%,transparent);color:#a06000}
.t-weak{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.t-nil{background:var(--line);color:var(--muted)}
.funnel{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.fbox{padding:12px;border-radius:12px;border:1px solid var(--line);text-align:center;background:var(--card)}
.fbox b{display:block;font-size:21px;margin-top:3px}
.score{display:flex;align-items:center;gap:18px;padding:18px;border-radius:16px;background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;box-shadow:0 12px 34px rgba(13,71,161,.3);flex-wrap:wrap}
.score .big{font-size:40px;font-weight:800;line-height:1;letter-spacing:-1.4px}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));margin-top:14px}
.stat{padding:13px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:19px;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:#fff;width:0;transition:width .9s var(--ease)}
/* ================= NTA EXAM SKIN ================= */
.nta{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;color:#000;
  font:14px/1.45 Verdana,Arial,Helvetica,sans-serif;z-index:50}
.nta *{box-sizing:border-box}
.nta-top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#f1f1f1;border-bottom:1px solid #c8c8c8}
.nta-top .ex{font-weight:700;font-size:15px;color:#13334f}
.nta-sys{display:flex;align-items:center;gap:8px;font-size:12px}
.nta-bar2{display:flex;align-items:center;gap:10px;padding:5px 10px;background:#fff;border-bottom:1px solid #d9d9d9;flex-wrap:wrap}
.nta-time{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.nta-time .box{border:1px solid #9bb7d4;background:#eaf3fb;padding:5px 11px;border-radius:3px;font-weight:700;font-variant-numeric:tabular-nums;color:#0b3c66}
.nta-time .box.warn{background:#fdecea;border-color:#e9a29d;color:#b5241c;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.55}}
.nta-secbar{display:flex;align-items:stretch;gap:0;background:#fff;border-bottom:2px solid #1f6fb2;overflow-x:auto;scrollbar-width:none}
.nta-secbar::-webkit-scrollbar{display:none}
.nta-sec{padding:7px 15px;font-size:12.5px;font-weight:700;color:#1f6fb2;background:#e8f1f9;border:1px solid #cfe0ef;border-bottom:0;white-space:nowrap}
.nta-sec.on{background:#1f6fb2;color:#fff;border-color:#1f6fb2}
.nta-sub{padding:5px 10px;background:#fafafa;border-bottom:1px solid #e0e0e0;display:flex;gap:6px;overflow-x:auto}
.nta-subbtn{padding:5px 14px;font-size:12.5px;font-weight:700;border:1px solid #c6c6c6;background:#fff;border-radius:3px}
.nta-subbtn.on{background:#13334f;color:#fff;border-color:#13334f}
.nta-main{flex:1;display:flex;min-height:0}
.nta-q{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid #d5d5d5}
.nta-qhead{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#f7f7f7;border-bottom:1px solid #e2e2e2;flex-wrap:wrap;font-size:12.5px}
.nta-qhead b{font-size:14px}
.nta-mk{margin-left:auto;display:flex;gap:14px;font-size:12px}
.nta-mk .pos{color:#177245;font-weight:700}
.nta-mk .neg{color:#b5241c;font-weight:700}
.nta-scroll{flex:1;overflow:auto;padding:14px 16px;background:#fff}
.nta-img{border:1px solid #e6e6e6;background:#fff;max-width:940px}
.nta-img img{display:block;width:100%;height:auto;transform-origin:top left}
.nta-opts{margin:16px 0 8px;max-width:940px}
.nta-opt{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid transparent;border-radius:4px;width:100%;text-align:left;font-size:14px}
.nta-opt:hover{background:#f4f8fc}
.nta-opt.on{background:#e3f0fb;border-color:#9dc3e6}
.nta-radio{width:19px;height:19px;border-radius:50%;border:2px solid #7a7a7a;display:grid;place-items:center;flex:none}
.nta-opt.on .nta-radio{border-color:#1f6fb2}
.nta-opt.on .nta-radio::after{content:"";width:9px;height:9px;border-radius:50%;background:#1f6fb2}
.nta-num{max-width:420px}
.nta-numdisp{border:1px solid #9a9a9a;padding:10px 12px;font-size:20px;font-weight:700;min-height:44px;background:#fff;letter-spacing:1px}
.nta-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.nta-keys button{padding:11px 0;border:1px solid #b9b9b9;background:#f5f5f5;font-weight:700;border-radius:3px}
.nta-keys button:active{background:#dfe9f3}
.nta-foot{display:flex;gap:7px;padding:8px 10px calc(8px + var(--safe-b));background:#f1f1f1;border-top:1px solid #cfcfcf;flex-wrap:wrap}
.nbtn{padding:8px 13px;border:1px solid #9b9b9b;background:linear-gradient(180deg,#fff,#e9e9e9);border-radius:3px;font-size:12.5px;font-weight:700;color:#222}
.nbtn:active{transform:translateY(1px)}
.nbtn.green{background:linear-gradient(180deg,#3fbb6e,#17924f);border-color:#127a41;color:#fff}
.nbtn.blue{background:linear-gradient(180deg,#4e9ede,#1f6fb2);border-color:#1a5d95;color:#fff}
.nbtn.orange{background:linear-gradient(180deg,#f7a93d,#e07c00);border-color:#c86e00;color:#fff}
.nbtn.red{background:linear-gradient(180deg,#e85d52,#c62828);border-color:#a92020;color:#fff}
.nta-side{width:316px;background:#fff;display:flex;flex-direction:column;flex:none}
.nta-prof{display:flex;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #e0e0e0;background:#fafcff}
.nta-prof img,.nta-prof .ph{width:54px;height:60px;object-fit:cover;border:1px solid #c9c9c9;background:#e9eef5;display:grid;place-items:center;color:#7d8ea3;font-size:11px}
.nta-legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;padding:9px;font-size:11px;background:#f7f9fc;border-bottom:1px solid #e0e0e0}
.nta-legend div{display:flex;align-items:center;gap:6px}
.pmark{width:26px;height:26px;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;position:relative}
.p-nv{background:#d9d9d9;color:#222;border:1px solid #bdbdbd;border-radius:3px}
.p-na{background:#d32f2f;color:#fff;clip-path:polygon(0 30%,50% 0,100% 30%,100% 100%,0 100%)}
.p-a{background:#17924f;color:#fff;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
.p-m{background:#6a1b9a;color:#fff;border-radius:50%}
.p-am{background:#6a1b9a;color:#fff;border-radius:50%}
.p-am::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;background:#fff;color:#17924f;border-radius:50%;font-size:10px;display:grid;place-items:center;border:1px solid #17924f}
.nta-pal{flex:1;overflow:auto;padding:10px;background:#fff}
.nta-pal .ttl{background:#1f6fb2;color:#fff;font-size:12px;font-weight:700;padding:5px 8px;margin:-10px -10px 10px}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pbtn{aspect-ratio:1;font-size:12px;font-weight:700;display:grid;place-items:center;position:relative;transition:transform .13s var(--spring)}
.pbtn:active{transform:scale(.88)}
.pbtn.cur{outline:3px solid #ffb300;outline-offset:1px}
.nta-sidefoot{padding:9px;border-top:1px solid #e0e0e0;background:#f4f4f4;display:flex;gap:6px;flex-wrap:wrap}
.nta-menu{display:none}
@media (max-width:920px){
  .nta-side{position:fixed;inset:auto 0 0 0;width:auto;max-height:78dvh;border-top:2px solid #1f6fb2;
    transform:translateY(103%);transition:transform .32s var(--ease);z-index:60;box-shadow:0 -10px 40px rgba(0,0,0,.25);border-radius:12px 12px 0 0}
  .nta-side.open{transform:none}
  .pgrid{grid-template-columns:repeat(7,1fr)}
  .nta-menu{display:inline-flex}
  .nta-q{border-right:0}
}
.scrim{position:fixed;inset:0;background:rgba(6,12,24,.45);opacity:0;pointer-events:none;transition:opacity .28s;z-index:55}
.scrim.on{opacity:1;pointer-events:auto}
@media print{body{background:#fff}.noprint{display:none!important}}
</style>
<script>
/* login gate: hide the app until a saved session is found (or the user logs in) */
(function(){try{
  var has=Object.keys(localStorage).some(function(x){return /^sb-.+-auth-token$/.test(x)})||sessionStorage.getItem('tf_offline')==='1';
  if(!has){
    document.documentElement.classList.add('tf-lock');
    setTimeout(function(){
      if(window.__tfGate||!document.documentElement.classList.contains('tf-lock'))return;
      var d=document.createElement('div');d.className='tf-gate';
      d.innerHTML='<div class="gx-form" style="margin:auto;text-align:center"><h2 class="gx-h">Sign-in is taking longer than usual</h2><p class="gx-p">We could not load the sign-in service. Check your connection, or continue and sign in later.</p><button class="gx-btn" onclick="location.reload()">Try again</button><button class="gx-link" style="margin-top:10px" onclick="sessionStorage.setItem(\'tf_offline\',\'1\');document.documentElement.classList.remove(\'tf-lock\');this.closest(\'.tf-gate\').remove()">Continue without signing in</button></div>';
      document.body.appendChild(d);
    },12000);
  }
}catch(e){}})();
</script>
<style>
html.tf-lock body>*:not(.tf-gate){visibility:hidden}
.tf-gate{position:fixed;inset:0;z-index:100010;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--card);color:var(--text);overflow:auto;font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.gx-side{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:56px 60px;color:#efe6d0;
  background:radial-gradient(900px 520px at 85% -10%,rgba(220,194,138,.20),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(44,66,114,.55),transparent 60%),linear-gradient(160deg,#0b1327,#15233f 60%,#0e1932)}
.gx-side::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(220,194,138,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(220,194,138,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(circle at 30% 40%,#000,transparent 75%);mask-image:radial-gradient(circle at 30% 40%,#000,transparent 75%)}
.gx-side>*{position:relative;z-index:1}
.gx-brand{display:flex;align-items:center;gap:14px}
.gx-mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 21px 'Playfair Display',Georgia,serif;color:#1a1405;background:linear-gradient(135deg,#f0dfb4,#b8934f);box-shadow:0 8px 22px rgba(184,147,79,.35)}
.gx-name{font:600 21px 'Playfair Display',Georgia,serif;letter-spacing:.01em}
.gx-hero h1{margin:0 0 16px;font:700 42px/1.12 'Playfair Display',Georgia,serif;letter-spacing:-.01em;color:#fbf3df}
.gx-hero h1 em{font-style:normal;color:#dcc28a}
.gx-hero p{margin:0 0 30px;max-width:460px;font-size:15.5px;line-height:1.65;color:rgba(239,230,208,.78)}
.gx-feat{list-style:none;margin:0;padding:0;display:grid;gap:15px}
.gx-feat li{display:flex;gap:14px;align-items:flex-start;font-size:14.5px;color:rgba(239,230,208,.9)}
.gx-feat i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(220,194,138,.55);display:grid;place-items:center;margin-top:1px}
.gx-feat i::after{content:"";width:6px;height:10px;border:solid #dcc28a;border-width:0 1.6px 1.6px 0;transform:rotate(45deg) translate(-1px,-1px)}
.gx-foot{font-size:12.5px;color:rgba(239,230,208,.55)}
.gx-main{display:flex;align-items:center;justify-content:center;padding:40px 28px;min-height:100%}
.gx-form{width:min(400px,100%)}
.gx-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.gx-h{margin:8px 0 8px;font:700 29px/1.2 'Playfair Display',Georgia,serif;letter-spacing:-.01em;color:var(--text)}
.gx-p{margin:0 0 26px;font-size:14.5px;line-height:1.6;color:var(--muted)}
.gx-lab{display:block;margin:0 0 7px;font-size:12.5px;font-weight:600;color:var(--text)}
.gx-in{width:100%;height:50px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);font:inherit;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.gx-in:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(184,147,79,.18)}
.gx-field{margin-bottom:16px;position:relative}
.gx-eye{position:absolute;right:6px;bottom:6px;height:38px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.gx-btn{width:100%;height:52px;border-radius:14px;font:600 15px Inter,sans-serif;letter-spacing:.01em;color:#fbf3df;background:linear-gradient(135deg,#14213d,#2c4272);border:1px solid rgba(220,194,138,.5);box-shadow:0 12px 26px rgba(20,33,61,.28);cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s}
.gx-btn:hover{transform:translateY(-1px);box-shadow:0 16px 32px rgba(20,33,61,.34)}
.gx-btn:disabled{opacity:.6;cursor:default;transform:none}
html[data-theme="dark"] .gx-btn{color:#1a1405;background:linear-gradient(135deg,#f0dfb4,#c9a45e);border-color:transparent}
.gx-sep{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px}
.gx-sep::before,.gx-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.gx-ghost{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);font:600 14.5px Inter,sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
.gx-ghost:hover{border-color:var(--gold);background:var(--brand-soft)}
.gx-link{display:inline-block;background:none;border:0;padding:6px 2px;color:var(--brand);font:600 13.5px Inter,sans-serif;cursor:pointer}
html[data-theme="light"] .gx-link,html:not([data-theme]) .gx-link{color:#1c2b4a}
.gx-link:disabled{color:var(--muted);cursor:default}
.gx-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.gx-otp{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:18px}
.gx-otp input{width:100%;height:58px;text-align:center;font:700 23px Inter,sans-serif;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.gx-otp input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(184,147,79,.18)}
.gx-alert{display:none;margin:0 0 18px;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;border:1px solid var(--line);background:var(--brand-soft);color:var(--text)}
.gx-alert.show{display:block}
.gx-alert.err{border-color:rgba(192,69,90,.45);background:rgba(192,69,90,.08);border-left:3px solid var(--red)}
.gx-alert.ok{border-color:rgba(46,143,102,.45);background:rgba(46,143,102,.08);border-left:3px solid var(--green)}
.gx-alert .gx-act{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.gx-sec{margin-top:26px;display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--muted)}
.gx-sec svg{width:14px;height:14px;flex:none}
.tf-gate [hidden]{display:none!important}
@media(max-width:860px){
  .tf-gate{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .gx-side{padding:22px 22px 24px;gap:0}
  .gx-hero,.gx-foot{display:none}
  .gx-main{align-items:flex-start;padding:28px 22px 40px}
}

<script type="module">
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);

/* ============ profile ============ */
const PROF=()=>Object.assign({student:'Student',form:'',batch:'',cls:'Class 12',course:'JEE (Main+Advanced) Test Series',
  institute:'TESTIFY',session:'2026-2027',centre:'Home / Online',photo:''},JSON.parse(localStorage.cbtProfile||'{}'));

/* ============ DB ============ */
const DB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('cbt-db',2);
    r.onupgradeneeded=ev=>{const d=r.result;
      if(!d.objectStoreNames.contains('tests'))d.createObjectStore('tests',{keyPath:'id'});
      if(!d.objectStoreNames.contains('images'))d.createObjectStore('images');
      if(!d.objectStoreNames.contains('attempts'))d.createObjectStore('attempts',{keyPath:'testId'});
      if(!d.objectStoreNames.contains('history'))d.createObjectStore('history',{keyPath:'id'});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=async(s,m,fn)=>{const d=await open();return new Promise((res,rej)=>{
    const t=d.transaction(s,m),rq=fn(t.objectStore(s));
    t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=()=>rej(t.error);});};
  return{put:(s,v,k)=>tx(s,'readwrite',st=>st.put(v,k)),get:(s,k)=>tx(s,'readonly',st=>st.get(k)),
    del:(s,k)=>tx(s,'readwrite',st=>st.delete(k)),all:s=>tx(s,'readonly',st=>st.getAll())};})();
const imgKey=(t,q)=>`${t}|${q}`;
const urlCache=new Map();
async function imgUrl(testId,qid){const k=imgKey(testId,qid);
  if(urlCache.has(k))return urlCache.get(k);
  const b=await DB.get('images',k);if(!b)return '';
  const u=URL.createObjectURL(b);urlCache.set(k,u);return u;}

/* ============ PDF ============ */
let pdfjs;
async function getPdfjs(){if(!pdfjs){
  const M=[['https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs','https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs'],
    ['https://unpkg.com/pdfjs-dist@4.7.76/build/pdf.min.mjs','https://unpkg.com/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs'],
    ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.worker.min.mjs']];
  let err;for(const[lib,wk]of M){try{pdfjs=await import(lib);pdfjs.GlobalWorkerOptions.workerSrc=wk;break;}catch(e){err=e;pdfjs=null;}}
  if(!pdfjs)throw err||new Error('PDF library could not be loaded');}
  return pdfjs;}
function trim(c){
  const ctx=c.getContext('2d'),{width:w,height:h}=c;let d;
  try{d=ctx.getImageData(0,0,w,h).data}catch{return c}
  const T=244;let top=h,bot=0,left=w,right=0;
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){const i=(y*w+x)*4;
    if(d[i]<T||d[i+1]<T||d[i+2]<T){if(y<top)top=y;if(y>bot)bot=y;if(x<left)left=x;if(x>right)right=x;}}
  if(bot<=top||right<=left)return c;
  const pad=14,x0=Math.max(0,left-pad),y0=Math.max(0,top-pad);
  const cw=Math.min(w-x0,right-left+pad*2),ch=Math.min(h-y0,bot-top+pad*2);
  const o=document.createElement('canvas');o.width=cw;o.height=ch;
  const g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cw,ch);g.drawImage(c,x0,y0,cw,ch,0,0,cw,ch);
  return o;}
async function pdfToPageBlobs(file,onP){
  const lib=await getPdfjs();
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];
  for(let i=1;i<=doc.numPages;i++){
    const page=await doc.getPage(i),base=page.getViewport({scale:1});
    const vp=page.getViewport({scale:Math.min(3,Math.max(2,2200/base.width))});
    const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
    const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    out.push(await new Promise(r=>trim(c).toBlob(r,'image/jpeg',.86)));
    onP?.(i,doc.numPages);await new Promise(r=>setTimeout(r));}
  return out;}
async function splitBlobAt(blob,ratio){
  const bmp=await createImageBitmap(blob),cut=Math.round(bmp.height*ratio);
  const mk=(y,hh)=>{const c=document.createElement('canvas');c.width=bmp.width;c.height=hh;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,hh);
    x.drawImage(bmp,0,y,bmp.width,hh,0,0,bmp.width,hh);
    return new Promise(r=>trim(c).toBlob(r,'image/jpeg',.86));};
  return[await mk(0,cut),await mk(cut,bmp.height-cut)];}

/* ============ smart question splitter (layout-aware) ============ */
const Q_RE=/^(?:(?:Q(?:uestion|ues)?|Que)\s*\.?\s*(\d{1,3})\b|(\d{1,3})\s*(?:[):\]]|\.(?!\d)))/i;
const HEAD_RE=/^(?:section\s*[-–:.]?\s*[a-z0-9]{1,3}|part\s*[-–:.]?\s*(?:[a-d]|i{1,3}|iv|[1-4])|physics|chemistry|mathematics|maths)\s*(?:[-–:(].{0,60})?$/i;
const END_RE=/^(?:answer\s*keys?|solutions?|hints?\s*(?:&|and)\s*solutions?)\s*[:\-–]?$/i;
function toLines(els){
  els.sort((a,b)=>(a.y0+a.y1)/2-(b.y0+b.y1)/2||a.x0-b.x0);
  const L=[];
  for(const e of els){const cy=(e.y0+e.y1)/2,h=e.y1-e.y0,l=L[L.length-1];
    if(l&&Math.abs(cy-l.cy)<Math.max(4,.55*Math.min(h,l.h))){l.els.push(e);l.cy=(l.cy*(l.els.length-1)+cy)/l.els.length;}
    else L.push({els:[e],cy,h});}
  return L.map(l=>{l.els.sort((a,b)=>a.x0-b.x0);
    return{text:l.els.map(e=>e.s).join(' ').replace(/\s+/g,' ').trim(),x0:l.els[0].x0,
      x1:Math.max(...l.els.map(e=>e.x1)),y0:Math.min(...l.els.map(e=>e.y0)),y1:Math.max(...l.els.map(e=>e.y1))};});}
function findGutter(els,W){            // two-column page? returns x of the gap or null
  if(els.length<30)return null;
  const B=60,lo=Math.floor(B*.35),hi=Math.floor(B*.65),cov=new Array(B).fill(0),lim=Math.max(1,els.length*.03);
  els.forEach(e=>{for(let i=Math.max(0,Math.floor(e.x0/W*B));i<=Math.min(B-1,Math.floor(e.x1/W*B));i++)cov[i]++;});
  let best=null;
  for(let i=lo;i<=hi;i++)if(cov[i]<=lim){let j=i;while(j+1<=hi&&cov[j+1]<=lim)j++;if(!best||j-i>best.j-best.i)best={i,j};i=j;}
  if(!best)return null;
  const gx=(best.i+best.j+1)/2/B*W;
  return els.filter(e=>e.x1<=gx+2).length>=els.length*.25&&els.filter(e=>e.x0>=gx-2).length>=els.length*.25?gx:null;}
function cropC(cv,x,y,w,h){x=Math.max(0,Math.round(x));y=Math.max(0,Math.round(y));
  w=Math.min(cv.width-x,Math.round(w));h=Math.min(cv.height-y,Math.round(h));if(w<4||h<4)return null;
  const o=document.createElement('canvas');o.width=w;o.height=h;const g=o.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(cv,x,y,w,h,0,0,w,h);return o;}
function hasInk(cv,x,y,w,h){const c=cropC(cv,x,y,w,h);if(!c)return false;
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let n=0;
  for(let i=0;i<d.length;i+=24)if(d[i]<225&&++n>40)return true;return false;}
function gapAt(cv,x0,x1,y,up=60){          // y just above a question's first line: cut in the blank band above it (keeps inline formulas whole)
  const ya=Math.max(0,Math.floor(y-up)),r0=Math.round(y-ya),h=Math.min(cv.height,Math.ceil(y+2))-ya,w=Math.max(4,Math.round(x1-x0));
  if(h<8||r0<4)return y-6;
  const d=cv.getContext('2d').getImageData(Math.max(0,Math.round(x0)),ya,Math.min(w,cv.width-Math.round(x0)),h).data,W=Math.min(w,cv.width-Math.round(x0)),ink=new Uint8Array(h);
  for(let r=0;r<h;r++){let n=0;for(let c=0;c<W;c+=2){const i=(r*W+c)*4;if(d[i]<215||d[i+1]<215||d[i+2]<215){if(++n>1)break;}}ink[r]=n>1?1:0;}
  let r=Math.min(h-1,r0-1);
  while(r>=0&&ink[r])r--;                                   // ink touching the line belongs to this question (formula tops, banners)
  if(r<0)return y-6;
  const e=r;while(r>=0&&!ink[r])r--;
  return e-r>=3?ya+Math.round((r+1+e)/2):y-6;}
function stitchC(parts){if(parts.length===1)return parts[0];
  const w=Math.max(...parts.map(p=>p.width)),h=parts.reduce((s,p)=>s+p.height+8,0);
  const o=document.createElement('canvas');o.width=w;o.height=h;const g=o.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,w,h);let y=0;parts.forEach(p=>{g.drawImage(p,0,y);y+=p.height+8;});return o;}
/* ============ question types: single, multi-correct, numerical, match-the-column ============ */
const TY={mcq:'MCQ',multi:'Multi',num:'Num',matrix:'Match'};
const TYL={mcq:'Single correct',multi:'One or more correct',num:'Numerical',matrix:'Match the following'};
const DEF_SEC={mcq:'SECTION A',num:'SECTION B',multi:'SECTION C',matrix:'SECTION D'};
const secOf=q=>q.section||DEF_SEC[q.type]||'SECTION';
const letterSet=a=>[...new Set(String(a??'').toUpperCase().match(/[A-D]/g)||[])].sort();
const parseMatrix=a=>{const o={};String(a??'').toUpperCase().replace(/\s+/g,'').split(',').forEach(x=>{const m=x.match(/^([A-Z])(?:->|>|=)([A-Z]+)$/);if(m)o[m[1]]=[...new Set(m[2])].sort().join('');});return o;};
const fmtMatrix=o=>Object.keys(o).sort().filter(k=>o[k]).map(k=>k+'->'+o[k]).join(',');
const matrixDims=q=>{const o=parseMatrix(q.answer),rows=Object.keys(o);let nr=4,nc=5;
  rows.forEach(r=>{nr=Math.max(nr,r.charCodeAt(0)-64);});
  Object.values(o).forEach(v=>v.split('').forEach(c=>{nc=Math.max(nc,c.charCodeAt(0)-79);}));
  return{nr:Math.min(nr,8),nc:Math.min(nc,8)};};
const negOf=(q,t)=>q.type==='mcq'?t.neg:q.type==='num'?(t.negNum??t.neg):q.type==='multi'?(t.negMulti??2):0;
function answerUI(q){
  const v=(window.__curAnswers||{})[q.id];
  if(q.type==='mcq')return `<div class="nta-opts">${['A','B','C','D'].map((o,i)=>`
        <button class="nta-opt ${v===o?'on':''}" data-opt="${o}">
          <span class="nta-radio"></span><span>(${i+1})&nbsp; Option ${o}</span></button>`).join('')}</div>`;
  if(q.type==='multi'){const st=new Set(letterSet(v));
    return `<div class="nta-opts">${['A','B','C','D'].map((o,i)=>`
        <button class="nta-opt ${st.has(o)?'on':''}" data-mopt="${o}">
          <span class="nta-radio sq"></span><span>(${i+1})&nbsp; Option ${o}</span></button>`).join('')}</div>
      <div class="hint" style="margin-top:8px">One or more options can be correct.</div>`;}
  if(q.type==='matrix'){const{nr,nc}=matrixDims(q),cur=parseMatrix(v),cols=Array.from({length:nc},(_,i)=>String.fromCharCode(80+i)),rows=Array.from({length:nr},(_,i)=>String.fromCharCode(65+i));
    return `<div class="nta-mx"><div class="mxh"><span></span>${cols.map(c=>`<span>${c}</span>`).join('')}</div>${rows.map(r=>`<div class="mxr"><b>${r}</b>${cols.map(c=>`<button class="mxc ${(cur[r]||'').includes(c)?'on':''}" data-mx="${r}${c}" aria-label="${r} to ${c}"></button>`).join('')}</div>`).join('')}</div>
      <div class="hint" style="margin-top:8px">Match each row of Column-I with one or more options of Column-II.</div>`;}
  return `<div class="nta-num" style="margin-top:14px"><div class="nta-numdisp" id="numDisp">${esc(v||'')}</div>
        <div class="nta-keys">${['1','2','3','4','5','6','7','8','9','0','.','-','⌫','Clr'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div></div>`;}
function schemeText(t){const T=new Set(t.questions.map(q=>q.type)),s=[];
  if(T.has('mcq'))s.push(`Single correct: +${t.marks} / −${t.neg}`);
  if(T.has('multi'))s.push(`One or more correct: +${t.marks} if all correct options are chosen, partial marks (+${+(t.marks/4).toFixed(2)} per correct option) when no wrong option is chosen, −${t.negMulti??2} if any wrong option is chosen`);
  if(T.has('num'))s.push(`Numerical: +${t.marks} / −${t.negNum??t.neg}`);
  if(T.has('matrix'))s.push(`Match the following: +${t.marks} when every row is right, partial marks for each correct row, no negative`);
  return s.join('. ')+'. Unattempted 0.';}
function scoreQ(q,g,P){
  const M=P.marks,none={st:'skipped',mk:0};
  if(g==null||g==='')return none;
  if(q.type==='mcq')return String(g).toUpperCase()===String(q.answer||'').toUpperCase()?{st:'correct',mk:M}:{st:'wrong',mk:-P.neg};
  if(q.type==='multi'){const C=new Set(letterSet(q.answer)),G=letterSet(g),ng=-(P.negMulti??2);
    if(!G.length)return none;
    if(!C.size||G.some(x=>!C.has(x)))return{st:'wrong',mk:ng};
    if(G.length===C.size)return{st:'correct',mk:M};
    return{st:'correct',mk:+(G.length*M/4).toFixed(2),partial:true};}
  if(q.type==='matrix'){const A=parseMatrix(q.answer),Gm=parseMatrix(g),rows=Object.keys(A),gl=Object.keys(Gm).length;
    if(!gl)return none;
    const ok=rows.filter(r=>Gm[r]===A[r]).length;
    if(rows.length&&ok===rows.length&&gl===rows.length)return{st:'correct',mk:M};
    if(ok>0)return{st:'correct',mk:+(M*ok/rows.length).toFixed(2),partial:true};
    return{st:'wrong',mk:0};}
  const ok=q.answer!==''&&!isNaN(parseFloat(q.answer))&&!isNaN(parseFloat(g))&&near(g,q.answer);
  return ok?{st:'correct',mk:M}:{st:'wrong',mk:-(P.negNum??P.neg)};}

/* ============ paper structure helpers (subjects, sections, shared passages, printed answer key) ============ */
const SUBJ_RE=/^(?:part\s*[-–:.]?\s*(?:\d+|[ivx]+|[a-d])\s*[-–:.]?\s*)?(physics|chemistry|mathematics|maths|math|biology|botany|zoology)\s*(?:[-–:(].{0,40})?$/i;
const SEC_RE=/^section\s*[-–:.]?\s*([ivx]+|[a-z]|\d+)\s*(?:\(\s*([^)]{1,30}?)\s*\))?\s*(?:[-–:].{0,40})?$/i;
const COMMON_RE=/^(?:common\s+(?:content|data|passage|information)|paragraph|passage|comprehension)\b.*?(?:questions?|ques?|q)\.?\s*(?:nos?\.?)?\s*(\d{1,3})\s*(?:to|and|&|-|–)\s*(\d{1,3})/i;

/* ============ HOME ============ */
async function renderHome(){
  const tests=(await DB.all('tests')).sort((a,b)=>b.createdAt-a.createdAt);
  const hist=await DB.all('history');
  const live=await DB.all('attempts');
  const lmap=Object.fromEntries(live.map(a=>[a.testId,a]));
  const byTest={};hist.forEach(h=>(byTest[h.testId]??=[]).push(h));
  shell(`
    <h1>Computer-Based Test Series</h1>
    <p class="sub">Upload a question paper, scan the answer key and take the test in an NTA-style interface, with a full analysis afterwards.</p>
    <div class="row" style="margin-bottom:16px;flex-wrap:wrap">
      <button class="btn primary" data-new>＋ New test from PDF</button>
      <label class="btn soft" style="margin:0">Import .json<input type="file" accept="application/json" id="impFile" style="display:none"></label>
      <button class="btn" data-act="prof">Edit candidate profile</button></div>
    <div class="grid">
      ${tests.length?tests.map(t=>{
        const hs=(byTest[t.id]||[]).sort((a,b)=>b.submittedAt-a.submittedAt);
        const best=hs.length?Math.max(...hs.map(h=>h.result.score)):null;
        const lv=lmap[t.id];const noKey=t.questions.filter(q=>!q.answer).length;
        return `<div class="card tcard">
          <div><div style="font-weight:750;font-size:16px">${esc(t.name)}</div>
          <div class="hint">${t.questions.length} Q · ${t.durationMin} min · ${subjectsOf(t).join(' / ')}</div></div>
          <div class="row" style="flex-wrap:wrap;gap:6px">
            ${hs.length?`<span class="chip">Best ${best}/${t.questions.length*t.marks}</span><span class="chip mut">${hs.length} attempt${hs.length>1?'s':''}</span>`:`<span class="chip mut">Not attempted</span>`}
            ${lv?`<span class="chip" style="background:color-mix(in srgb,var(--amber) 20%,transparent);color:#a06000">Paused</span>`:''}
            ${noKey?`<span class="chip" style="background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)">${noKey} key missing</span>`:''}</div>
          ${hs.length?`<div class="hint">Last: ${dmy(hs[0].submittedAt)} · ${hs[0].result.score} marks · ${hs[0].result.accuracy}% acc</div>`:''}
          <div class="row" style="flex-wrap:wrap">
            <button class="btn primary sm" data-open="${t.id}">${lv?'Resume test':'Start test'}</button>
            ${hs.length?`<button class="btn sm" data-last="${hs[0].id}">Analysis</button>`:''}
            <button class="btn sm" data-edit="${t.id}">Edit</button>
            <div class="spacer"></div>
            <button class="btn ghost sm" data-exp="${t.id}">⤓</button>
            <button class="btn ghost sm" data-del="${t.id}" style="color:var(--red)">🗑</button></div></div>`}).join('')
      :`<div class="card empty">No tests yet. Tap <b>＋ New test from PDF</b> to create your first one.</div>`}
    </div>`,'home');
  $('#impFile').onchange=async e=>{const f=e.target.files[0];if(f)await importTest(f);};
  setPageClick(async e=>{
    if(e.target.closest('[data-new]'))return go('builder');
    const o=e.target.closest('[data-open]');
    if(o)return go(lmap[o.dataset.open]?'exam':'instructions',{testId:o.dataset.open});
    const l=e.target.closest('[data-last]');if(l)return go('result',{hid:l.dataset.last});
    const ed=e.target.closest('[data-edit]');if(ed)return go('builder',{test:await DB.get('tests',ed.dataset.edit)});
    const ex=e.target.closest('[data-exp]');if(ex)return exportTest(ex.dataset.exp);
    const d=e.target.closest('[data-del]');
    if(d){if(!confirm('Delete this test, its images and all attempts?'))return;
      const t=await DB.get('tests',d.dataset.del);
      for(const q of t.questions)await DB.del('images',imgKey(t.id,q.id));
      await DB.del('tests',t.id);await DB.del('attempts',t.id);
      for(const h of await DB.all('history'))if(h.testId===t.id)await DB.del('history',h.id);
      toast('Deleted');renderHome();}});}

async function renderBuilder(existing){

  shell(`

    const r=await aiSolve(draft.questions,async q=>pending.get(q.id)||await DB.get('images',imgKey(draft.id,q.id)),(d,n)=>st.textContent=`AI solving ${d}/${n}…`);
    if(!r)return;drawKeys();

  $('#bAI').onclick=runAI;$('#bAIs').onclick=()=>aiSettings();

      <div class="bld-row" data-q="${q.id}"><b>Q${q.no}</b><img data-zoom alt="Q${q.no}">

        <select data-f="type">${Object.keys(TYL).map(k=>`<option value="${k}" ${q.type===k?'selected':''}>${TYL[k]}</option>`).join('')}</select>

          :q.type==='multi'?['A','B','C','D'].map(o=>`<button class="btn sm ${letterSet(q.answer).includes(o)?'primary':''}" data-mans="${o}">${o}</button>`).join(' ')
          :`<input data-f="answer" value="${esc(q.answer||'')}" placeholder="${q.type==='matrix'?'A->R,B->PQ,C->S,D->T':'e.g. 12'}">`}</div>
        <button class="btn ghost sm" data-split>✂</button></div>`).join('');
    for(const q of draft.questions){const im=host.querySelector(`[data-q="${q.id}"] img`);if(im)im.src=await thumb(q);}}
  $('#keyList').onclick=async e=>{
    const row=e.target.closest('[data-q]');if(!row)return;
    const q=draft.questions.find(x=>x.id===row.dataset.q);
    const a=e.target.closest('[data-ans]');
    if(a){q.answer=a.dataset.ans;q.ai=false;q.remark='';buzz();drawKeys();return;}
    const ma=e.target.closest('[data-mans]');
    if(ma){const st=new Set(letterSet(q.answer));st.has(ma.dataset.mans)?st.delete(ma.dataset.mans):st.add(ma.dataset.mans);q.answer=[...st].sort().join(',');q.ai=false;q.remark='';buzz();drawKeys();return;}
    if(e.target.matches('[data-zoom]'))return lightbox(e.target.src);
    if(e.target.closest('[data-split]')){
      const blob=pending.get(q.id)||await DB.get('images',imgKey(draft.id,q.id));if(!blob)return;
      const ratio=await askSplit(URL.createObjectURL(blob));if(!ratio)return;
      const[a1,a2]=await splitBlobAt(blob,ratio);
      const nq={id:uid(),subject:q.subject,section:q.section||'',chapter:q.chapter,type:q.type,answer:''};
      pending.set(q.id,a1);pending.set(nq.id,a2);
      draft.questions.splice(idxOf(draft,q.id)+1,0,nq);
      draft.questions.forEach((x,i)=>x.no=i+1);drawKeys();toast('Page split');}};
  $('#keyList').onchange=e=>{const row=e.target.closest('[data-q]');if(!row)return;
    const q=draft.questions.find(x=>x.id===row.dataset.q),f=e.target.dataset.f;if(!f)return;
    q[f]=e.target.value;if(f==='answer'){q.ai=false;q.remark='';q.answer=normAnswer(q.type,q.answer);if(q.type==='matrix'||q.type==='multi')drawKeys();}if(f==='type'){q.answer='';q.ai=false;q.remark='';drawKeys();}};
  $('#bPdf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    const bar=$('#bProg');bar.style.display='block';$('#bStat').textContent='Rendering…';
    try{const cb=(i,n,l)=>{bar.firstElementChild.style.width=(i/n*100)+'%';$('#bStat').textContent=`${l||'Page'} ${i}/${n}…`;};
      const want=pattern.reduce((a,x)=>a+(+x.count||0),0);
      let blobs=null;try{blobs=await pdfToQuestionBlobs(f,cb,want);}catch(e){console.warn('smart split failed',e);}
      const meta=blobs&&blobs.meta,mode=blobs&&blobs.mode;
      if(!blobs)blobs=await pdfToPageBlobs(f,cb);
      draft.questions=blobs.map((b,i)=>{const id=uid();pending.set(id,b);return{id,no:i+1,subject:'',section:'',chapter:'',type:'mcq',answer:''};});
      applyPattern(draft.questions,pattern);
      if(meta)draft.questions.forEach((q,i)=>{const m=meta[i];if(!m)return;if(m.subject)q.subject=m.subject;q.section=m.section||'';q.type=m.type||q.type;q.answer=m.answer||'';});
      if(!$('#bName').value)$('#bName').value=f.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim();
      const subj={};draft.questions.forEach(q=>{subj[q.subject||'—']=(subj[q.subject||'—']||0)+1;});
      const parts=Object.entries(subj).map(([k,v])=>k+' '+v).join(' · ');
      if(meta){const got=draft.questions.filter(q=>q.answer).length;
        $('#bStat').textContent=`${blobs.length} questions found · ${parts} · answer key read for ${got}/${blobs.length}.`+(blobs.guessed?' Question types were guessed from the section names — please check them.':'')+(got<blobs.length?' Fill the missing answers below or use the key scanner.':'');}
      else if(mode==='page')$('#bStat').textContent=`${blobs.length} pages imported as ${blobs.length} questions (one question per page) · ${parts}.`+(want&&want!==blobs.length?` Your pattern expects ${want} — adjust it and press Apply pattern if needed.`:'');
      else $('#bStat').textContent=`Could not detect question numbers — imported ${blobs.length} pages. Use ✂ to split them.`;
      drawKeys();toast('PDF imported');}
    catch(err){console.error(err);$('#bStat').textContent=/dynamically imported|Failed to fetch|load/i.test(err.message)?'The PDF reader could not be downloaded. Check your internet connection and try again.':'PDF error: '+err.message;}
    bar.style.display='none';};
  $('#bSave').onclick=async()=>{
    draft.name=$('#bName').value.trim()||'Untitled test';draft.paperType=$('#bType').value;
    draft.durationMin=+$('#bDur').value||180;draft.marks=+$('#bMarks').value||4;
    draft.neg=Math.abs(+$('#bNeg').value||0);draft.negNum=Math.abs(+$('#bNegN').value||0);

    for(const[qid,blob]of pending)await DB.put('images',blob,imgKey(draft.id,qid));
    await DB.put('tests',draft);toast('Saved');go('home');};
  drawKeys();}
function lightbox(src){const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box" style="max-width:min(940px,96vw);padding:8px;background:#fff"><img src="${src}" style="width:100%;border-radius:10px"></div>`;
  m.onclick=()=>m.remove();document.body.appendChild(m);}
function askSplit(src){return new Promise(res=>{
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box" style="max-width:min(760px,96vw)"><h2>Click where the second question begins</h2>
    <div style="position:relative"><img src="${src}" id="spImg" style="width:100%;border-radius:10px;background:#fff">
    <div id="spLine" style="position:absolute;left:0;right:0;height:2px;background:var(--red);display:none"></div></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="spOk" disabled>Split here</button>
    <button class="btn ghost" id="spNo">Cancel</button></div></div>`;
  document.body.appendChild(m);let ratio=0;
  const img=$('#spImg',m),line=$('#spLine',m);
  img.onclick=ev=>{const r=img.getBoundingClientRect();ratio=(ev.clientY-r.top)/r.height;
    line.style.display='block';line.style.top=(ev.clientY-r.top)+'px';$('#spOk',m).disabled=false;};
  $('#spOk',m).onclick=()=>{m.remove();res(ratio);};
  $('#spNo',m).onclick=()=>{m.remove();res(0);};});}

/* ============ import/export ============ */
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportTest(id){
  const t=await DB.get('tests',id),imgs={};
  for(const q of t.questions)imgs[q.id]=await b64(await DB.get('images',imgKey(id,q.id)));
  dl(new Blob([JSON.stringify({test:t,images:imgs})],{type:'application/json'}),`${t.name.replace(/\s+/g,'-')}.cbt.json`);
  toast('Exported');}
async function importTest(f){
  const data=typeof f==='string'?JSON.parse(f):JSON.parse(await f.text());
  const t=data.test;t.id=t.id||uid();
  for(const[qid,durl]of Object.entries(data.images||{}))await DB.put('images',await(await fetch(durl)).blob(),imgKey(t.id,qid));
  await DB.put('tests',t);toast('Imported');renderHome();}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);}

/* ============ grading ============ */
const near=(a,b)=>Math.abs(parseFloat(a)-parseFloat(b))<=0.01;
function isCorrect(q,g){return scoreQ(q,g,{marks:1,neg:0,negNum:0,negMulti:0}).st==='correct';}
function grade(t,at){
  const per={},perCh={},records=[];
  const ts=t.questions.map(q=>at.timeSpent[q.id]||0).filter(x=>x>2).sort((a,b)=>a-b);
  const med=ts.length?ts[Math.floor(ts.length/2)]:60;
  let score=0,correct=0,wrong=0,skipped=0;
  t.questions.forEach(q=>{
    const g=at.answers[q.id],tm=at.timeSpent[q.id]||0,ch=(q.chapter||'').trim()||'Unspecified';
    const negV=negOf(q,t);
    const sc=scoreQ(q,g,t),st=sc.st,mk=sc.mk;score+=mk;
    if(st==='correct')correct++;else if(st==='wrong')wrong++;else skipped++;
    const slow=tm>Math.max(100,med*2),fast=tm<Math.max(20,med*0.45);
    const tag=st==='skipped'?(tm>25?'Attempted & left':'Not attempted')
      :st==='correct'?(sc.partial?'Partial credit':slow?'Overtime correct':'Perfect attempt'):(fast?'Careless / guess':'Concept gap');
    const put=o=>{o.total++;o.time+=tm;o.score+=mk;o[st]++;o.max+=t.marks;};
    per[q.subject]??={score:0,max:0,correct:0,wrong:0,skipped:0,total:0,time:0};put(per[q.subject]);
    const ck=q.subject+' ▸ '+ch;
    perCh[ck]??={subject:q.subject,chapter:ch,score:0,max:0,correct:0,wrong:0,skipped:0,total:0,time:0};put(perCh[ck]);
    records.push({no:q.no,subject:q.subject,chapter:ch,type:q.type,status:st,time:tm,marks:mk,tag,partial:!!sc.partial,given:g??'',answer:q.answer});});
  const attempted=correct+wrong;const tags={};records.forEach(r=>tags[r.tag]=(tags[r.tag]||0)+1);
  return{score,total:t.questions.length*t.marks,correct,wrong,skipped,attempted,
    accuracy:attempted?Math.round(correct/attempted*100):0,
    pct:+(score/(t.questions.length*t.marks)*100).toFixed(2),
    per,perCh,records,tags,negLost:records.filter(r=>r.status==='wrong').reduce((s,r)=>s-r.marks,0),
    median:med,timeUsed:Object.values(at.timeSpent).reduce((a,b)=>a+b,0)};}

/* ============ RESULT / ANALYSIS ============ */
async function renderResult(hid){
  const h=await DB.get('history',hid);if(!h)return go('home');
  const r=h.result;let tab='overview';
  const acc=o=>o.correct+o.wrong?Math.round(o.correct/(o.correct+o.wrong)*100):0;
  const verdict=o=>{if(o.correct+o.wrong===0)return['t-nil','Untouched'];const a=acc(o);
    return a>=80?['t-str','Strong']:a>=50?['t-mid','Needs practice']:['t-weak','Weak'];};
  const barc=a=>a>=80?'var(--green)':a>=50?'var(--amber)':'var(--red)';
  const overview=()=>`
    <div class="funnel">
      <div class="fbox"><span class="hint">Correct</span><b style="color:var(--green)">${r.correct}</b></div>
      <div class="fbox"><span class="hint">Incorrect</span><b style="color:var(--red)">${r.wrong}</b></div>
      <div class="fbox"><span class="hint">Unattempted</span><b>${r.skipped}</b></div>
      <div class="fbox"><span class="hint">Accuracy</span><b>${r.accuracy}%</b></div>
      <div class="fbox"><span class="hint">Negative loss</span><b style="color:var(--red)">−${r.negLost}</b></div>
      <div class="fbox"><span class="hint">Percentage</span><b>${r.pct}%</b></div></div>
    <div class="card" style="padding:15px;margin-top:14px"><h2>Attempt quality</h2>
      ${Object.entries(r.tags).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="margin:8px 0">
        <span style="flex:1">${k}</span><div class="abar" style="flex:2"><i style="width:${v/r.records.length*100}%;background:var(--brand)"></i></div>
        <b style="width:32px;text-align:right">${v}</b></div>`).join('')}
      <p class="hint" style="margin:10px 0 0">Careless = wrong in under half the median time. Concept gap = wrong after a long time. Overtime correct = right, but took over 2× the median time.</p></div>`;
  const subjects=()=>`<div class="card" style="padding:15px"><div class="tblwrap"><table>
    <thead><tr><th>Subject</th><th>Score</th><th>Acc</th><th>Correct</th><th>Wrong</th><th>Left</th><th>Time</th></tr></thead>
    <tbody>${Object.entries(r.per).map(([s,p])=>`<tr><td><b>${esc(s)}</b>
      <div class="abar" style="margin-top:5px"><i style="width:${acc(p)}%;background:${barc(acc(p))}"></i></div></td>
      <td><b>${p.score}</b>/${p.max}</td><td>${acc(p)}%</td><td style="color:var(--green)">${p.correct}</td>
      <td style="color:var(--red)">${p.wrong}</td><td>${p.skipped}</td><td>${hhmmss(p.time)}</td></tr>`).join('')}</tbody></table></div></div>`;

  const timeTab=()=>{const cs=r.records.filter(x=>x.status==='correct'),ws=r.records.filter(x=>x.status==='wrong');
    const avg=a=>a.length?a.reduce((s,x)=>s+x.time,0)/a.length:0;
    const over=r.records.filter(x=>x.time>r.median*2&&x.time>60).sort((a,b)=>b.time-a.time).slice(0,12);
    return `<div class="stats">
      <div class="stat"><span class="hint">Total time</span><b>${hhmmss(r.timeUsed)}</b></div>
      <div class="stat"><span class="hint">Avg / correct</span><b>${mmss(avg(cs))}</b></div>
      <div class="stat"><span class="hint">Avg / wrong</span><b>${mmss(avg(ws))}</b></div>
      <div class="stat"><span class="hint">Median / Q</span><b>${mmss(r.median)}</b></div></div>
      <div class="card" style="padding:15px;margin-top:14px"><h2>Time traps</h2>
      ${over.map(x=>`<div class="row" style="margin:7px 0"><b style="width:44px">Q${x.no}</b>
        <span style="flex:1" class="hint">${esc(x.subject)}</span>
        <span class="tag ${x.status==='correct'?'t-str':x.status==='wrong'?'t-weak':'t-nil'}">${x.status}</span>
        <b style="width:68px;text-align:right">${mmss(x.time)}</b></div>`).join('')||'<div class="hint">No major time traps.</div>'}</div>`;};
  const qtab=()=>`<div class="card" style="padding:15px"><div class="tblwrap"><table>
    <thead><tr><th>Q</th><th>Subject</th><th>You</th><th>Key</th><th>Marks</th><th>Time</th><th>Tag</th></tr></thead>
    <tbody>${r.records.map(x=>`<tr data-q="${x.no-1}" style="cursor:pointer"><td><b>Q${x.no}</b></td><td>${esc(x.subject)}</td>
      <td style="color:${x.status==='correct'?'var(--green)':x.status==='wrong'?'var(--red)':'var(--muted)'}">${esc(x.given||'—')}</td>
      <td>${esc(x.answer||'—')}</td><td>${x.marks>0?'+':''}${x.marks}</td><td>${mmss(x.time)}</td><td class="hint">${x.tag}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  const paint=()=>{$('#anBody').innerHTML={overview:overview(),subjects:subjects(),time:timeTab(),questions:qtab()}[tab];

    $$('#anTabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));

    $$('#anBody [data-q]').forEach(tr=>tr.onclick=()=>go('review',{hid,index:+tr.dataset.q}));};

async function renderReview(hid,index){
  const h=await DB.get('history',hid);if(!h)return go('home');
  const t=await DB.get('tests',h.testId);
  const qs=h.qmeta;let i=index,filter='all';
  const stOf=q=>scoreQ(q,h.answers[q.id],h).st;
  const visible=()=>qs.filter(q=>filter==='all'?1:filter==='marked'?h.marked[q.id]:stOf(q)===filter);
  shell(`
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:12px" id="filters">
      ${[['all','All'],['correct','Correct'],['wrong','Wrong'],['skipped','Unattempted'],['marked','Marked']]
        .map(([k,l])=>`<button class="btn sm ${k==='all'?'primary':''}" data-f="${k}">${l}</button>`).join('')}
      <div class="spacer"></div><button class="btn ghost sm" id="toRes">‹ Analysis</button></div>
    <div class="card" style="padding:14px" id="revCard"></div>
    <div class="card" style="padding:12px;margin-top:12px"><div class="pgrid" id="revPal" style="grid-template-columns:repeat(auto-fill,minmax(42px,1fr))"></div></div>`);
  $('#toRes').onclick=()=>go('result',{hid});
  $('#filters').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;
    filter=b.dataset.f;$$('#filters [data-f]').forEach(x=>x.classList.toggle('primary',x===b));
    const l=visible();if(l.length){i=qs.findIndex(x=>x.id===l[0].id);paint();}else toast('Nothing here');};
  async function paint(){
    const q=qs[i],url=t?await imgUrl(t.id,q.id):'',st=stOf(q),g=h.answers[q.id];
    const col=st==='correct'?'var(--green)':st==='wrong'?'var(--red)':'var(--muted)';
    $('#revCard').innerHTML=`
      <div class="row" style="margin-bottom:10px"><div><b>Question ${q.no}</b>
        <div class="hint">${esc(q.subject)} · ${esc(secOf(q))} · ${TYL[q.type]||q.type} · ${mmss(h.timeSpent[q.id]||0)}</div></div>
        <div class="spacer"></div><span class="chip" style="background:color-mix(in srgb,${col} 16%,transparent);color:${col}">${scoreQ(q,g,h).partial?'partial credit':st}</span></div>
      ${url?`<div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff"><img src="${url}" style="width:100%;display:block"></div>`
        :'<div class="hint">Question image unavailable (test deleted).</div>'}
      ${(q.type==='mcq'||q.type==='multi')?`<div style="display:grid;gap:8px;margin-top:12px">${['A','B','C','D'].map(o=>{
        const CS=new Set(q.type==='multi'?letterSet(q.answer):[String(q.answer).toUpperCase()]),GS=new Set(q.type==='multi'?letterSet(g):[String(g||'').toUpperCase()]),ok=CS.has(o),mine=GS.has(o);
        return `<div style="padding:11px 13px;border:1.5px solid ${ok?'var(--green)':mine?'var(--red)':'var(--line)'};border-radius:11px;
          background:${ok?'color-mix(in srgb,var(--green) 10%,transparent)':mine?'color-mix(in srgb,var(--red) 10%,transparent)':'transparent'};font-weight:600">
          ${o}${ok?' · correct answer':''}${mine?' · your answer':''}</div>`;}).join('')}</div>`
        :`<div class="stats"><div class="stat"><span class="hint">Your answer</span><b>${esc(g||'—')}</b></div>
          <div class="stat"><span class="hint">Correct answer</span><b>${esc(q.answer||'—')}</b></div></div>`}
      ${(()=>{const tq=t&&t.questions.find(x=>x.id===q.id);return tq&&tq.remark?`<div class="card" style="padding:12px;margin-top:12px"><div class="hint">${tq.ai?'🤖 AI explanation — verify before trusting':'Explanation'}</div><div style="margin-top:4px">${esc(tq.remark)}</div></div>`:'';})()}
      <div class="row" style="margin-top:14px"><button class="btn sm" id="pv">‹ Prev</button><button class="btn sm" id="nx">Next ›</button></div>`;
    $('#pv').onclick=()=>{const l=visible(),p=l.findIndex(x=>x.id===q.id);if(p>0){i=qs.findIndex(x=>x.id===l[p-1].id);paint();}};
    $('#nx').onclick=()=>{const l=visible(),p=l.findIndex(x=>x.id===q.id);if(p<l.length-1){i=qs.findIndex(x=>x.id===l[p+1].id);paint();}};
    $('#revPal').innerHTML=qs.map((x,n)=>{const s=stOf(x);
      return `<button class="pmark pbtn ${s==='correct'?'p-a':s==='wrong'?'p-na':'p-nv'} ${n===i?'cur':''}" data-i="${n}">${x.no}</button>`;}).join('');
    $('#revPal').onclick=e=>{const b=e.target.closest('[data-i]');if(b){i=+b.dataset.i;paint();}};}
  paint();}

    const esc2=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function note(kind,html,actions){const a=$g('.gx-alert');if(!a)return;a.className='gx-alert'+(kind?' show '+kind:'');a.innerHTML=html||'';
      if(actions&&actions.length){const d=document.createElement('div');d.className='gx-act';actions.forEach(([t,fn])=>{const b=document.createElement('button');b.className='gx-link';b.textContent=t;b.onclick=fn;d.appendChild(b);});a.appendChild(d);}}
    function done(){clearInterval(tmr);g.remove();gateOpen=false;document.documentElement.classList.remove('tf-lock');showChip();resolve();}
    function goOffline(){sessionStorage.setItem('tf_offline','1');syncReady=false;done();}
    async function netProblem(){
      note('err','Checking your connection\u2026');
      const ok=sb?await reachable():false;
      if(sb&&ok) return note('ok','The connection looks fine now. Please try again.');
      note('err','<b>We could not reach the sign-in server.</b> Your device may be offline, or your network may be blocking the service. Switching networks (Wi-Fi or mobile data) or changing your DNS often fixes this.',
        [['Try again',()=>location.reload()],['Connection fix',setProxy],['Continue without signing in',goOffline]]);}
    function setProxy(){const cur=localStorage.getItem('tf_sb_proxy')||'';const v=prompt('Paste your proxy address (https://\u2026workers.dev). Leave empty to connect directly.',cur);
      if(v===null)return;const t=v.trim();if(t&&!/^https:\/\/[^\s]+$/.test(t))return note('err','That address must start with https://');
      if(t)localStorage.setItem('tf_sb_proxy',t);else localStorage.removeItem('tf_sb_proxy');location.reload();}
    async function run(fn){if(busy)return;busy=true;g.querySelectorAll('button,input').forEach(x=>x.disabled=true);
      try{await fn();}catch(e){ if(errKind(e)==='net')await netProblem(); else note('err',esc2(niceErr(e))); }
      finally{busy=false;g.querySelectorAll('button,input').forEach(x=>x.disabled=false);tick();}}
    function later(fn,n=0){if(!busy)return run(fn);if(n<60)setTimeout(()=>later(fn,n+1),50);}   // auto-submit must never be dropped while a request is finishing
    function tick(){const b=$g('#gxResend');if(!b)return;b.textContent=left>0?'Resend code in '+left+'s':'Resend code';b.disabled=busy||left>0;}
    function cooldown(){left=OTP_WAIT;clearInterval(tmr);tick();tmr=setInterval(()=>{left--;tick();if(left<=0)clearInterval(tmr);},1000);}

    async function afterLogin(user){
      note('', 'Signed in. Restoring your data\u2026');$g('.gx-alert').className='gx-alert show';
      try{
        const r=await restoreFromCloud(user);
        syncReady=true;
        if(r==='restored'){note('ok','Your data has been restored. Opening TesTify\u2026');setTimeout(()=>location.reload(),450);return;}
        done();
      }catch(e){
        note('err','<b>You are signed in, but your cloud data could not be loaded</b> ('+esc2(niceErr(e))+'). Backups stay paused until it loads, so nothing is overwritten.',
          [['Try again',()=>run(()=>afterLogin(user))],['Continue anyway',()=>done()]]);}}
    async function sendCode(){
      const em=($g('#gxEm')?.value||email).trim().toLowerCase();
      if(!okEm(em)) return note('err','Please enter a valid email address.');
      note('','');const {error}=await withTimeout(sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}}));
      if(error) throw error;
      email=em;render('code');cooldown();}
    async function verify(){
      const code=[...F.querySelectorAll('.gx-otp input')].map(i=>i.value).join('');
      if(code.length!==OTP_LEN) return note('err','Enter the '+OTP_LEN+'-digit code from your email.');
      note('','');const {data,error}=await withTimeout(sb.auth.verifyOtp({email,token:code,type:'email'}));
      if(error){F.querySelectorAll('.gx-otp input').forEach(i=>i.value='');F.querySelector('.gx-otp input').focus();throw error;}
      await afterLogin(data.user||(data.session&&data.session.user));}

    function render(v){
      view=v;
      if(v==='email')F.innerHTML=`<div class="gx-eyebrow">Welcome</div><h2 class="gx-h">Sign in to TesTify</h2>
        <p class="gx-p">Enter your email and we will send you a one-time code. No password needed.</p>
        <div class="gx-alert" role="alert"></div>
        <div class="gx-field"><label class="gx-lab" for="gxEm">Email address</label><input class="gx-in" id="gxEm" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" value="${esc2(email)}"></div>
        <button class="gx-btn" id="gxGo">Continue</button>
        <div class="gx-sep">or</div>
        <button class="gx-ghost" id="gxPw">Sign in with a password</button>
        <div class="gx-sec">${LOCK_SVG}<span>Secure sign-in \u00b7 your data stays in your account</span></div>`;
      if(v==='code')F.innerHTML=`<div class="gx-eyebrow">Verification</div><h2 class="gx-h">Check your email</h2>
        <p class="gx-p">We sent a ${OTP_LEN}-digit code to <b style="color:var(--text)">${esc2(email)}</b>. It can take a minute to arrive \u2014 check your spam folder too.</p>
        <div class="gx-alert" role="alert"></div>
        <div class="gx-otp">${Array.from({length:OTP_LEN},(_,i)=>`<input inputmode="numeric" pattern="[0-9]*" ${i===0?'':'maxlength="1"'} aria-label="Digit ${i+1}" ${i===0?'autocomplete="one-time-code"':'autocomplete="off"'}>`).join('')}</div>
        <button class="gx-btn" id="gxVer">Verify and continue</button>
        <div class="gx-row"><button class="gx-link" id="gxResend">Resend code</button><button class="gx-link" id="gxChange">Use a different email</button></div>`;
      if(v==='pw')F.innerHTML=`<div class="gx-eyebrow">Password</div><h2 class="gx-h">Sign in with a password</h2>
        <p class="gx-p">Use the email and password you created for TesTify.</p>
        <div class="gx-alert" role="alert"></div>
        <div class="gx-field"><label class="gx-lab" for="gxEm">Email address</label><input class="gx-in" id="gxEm" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" value="${esc2(email)}"></div>
        <div class="gx-field"><label class="gx-lab" for="gxPwd">Password</label><input class="gx-in" id="gxPwd" type="password" autocomplete="current-password" placeholder="At least 6 characters" style="padding-right:78px"><button class="gx-eye gx-link" id="gxEye" type="button">Show</button></div>
        <button class="gx-btn" id="gxIn">Sign in</button>
        <div class="gx-row"><button class="gx-link" id="gxUp">Create an account</button><button class="gx-link" id="gxBack">Use email code instead</button></div>`;
      bind(v);}
    function bind(v){
      const em=$g('#gxEm');
      if(v==='email'){$g('#gxGo').onclick=()=>run(sendCode);em.onkeydown=e=>{if(e.key==='Enter')run(sendCode);};$g('#gxPw').onclick=()=>{email=em.value.trim();render('pw');};setTimeout(()=>em.focus(),60);}
      if(v==='code'){
        const box=[...F.querySelectorAll('.gx-otp input')];
        const fill=t=>{const d=t.replace(/\D/g,'').slice(0,OTP_LEN);d.split('').forEach((c,i)=>box[i].value=c);(box[Math.min(d.length,OTP_LEN-1)]).focus();if(d.length===OTP_LEN)later(verify);};
        box.forEach((b,i)=>{
          b.oninput=()=>{const d=b.value.replace(/\D/g,'');if(d.length>1){fill(d);return;}b.value=d;if(d&&i<OTP_LEN-1)box[i+1].focus();if(box.every(x=>x.value))later(verify);};
          b.onkeydown=e=>{if(e.key==='Backspace'&&!b.value&&i>0){box[i-1].value='';box[i-1].focus();}else if(e.key==='ArrowLeft'&&i>0)box[i-1].focus();else if(e.key==='ArrowRight'&&i<OTP_LEN-1)box[i+1].focus();else if(e.key==='Enter')run(verify);};
          b.onpaste=e=>{e.preventDefault();fill((e.clipboardData||window.clipboardData).getData('text'));};});
        $g('#gxVer').onclick=()=>run(verify);$g('#gxResend').onclick=()=>run(sendCode);
        $g('#gxChange').onclick=()=>{clearInterval(tmr);left=0;render('email');};tick();setTimeout(()=>{if(!box.some(x=>x.value)&&!box.includes(document.activeElement))box[0].focus();},60);}   // never steal focus from digits already being typed
      if(v==='pw'){
        const pw=$g('#gxPwd'),creds=()=>{const e=em.value.trim().toLowerCase(),p=pw.value;
          if(!okEm(e)){note('err','Please enter a valid email address.');return null;}
          if(p.length<6){note('err','Your password must be at least 6 characters.');return null;}return{email:e,password:p};};
        $g('#gxEye').onclick=()=>{const h=pw.type==='password';pw.type=h?'text':'password';$g('#gxEye').textContent=h?'Hide':'Show';};
        $g('#gxIn').onclick=()=>run(async()=>{const c=creds();if(!c)return;note('','');
          const {data,error}=await withTimeout(sb.auth.signInWithPassword(c));if(error)throw error;await afterLogin(data.user);});
        $g('#gxUp').onclick=()=>run(async()=>{const c=creds();if(!c)return;note('','');
          const {data,error}=await withTimeout(sb.auth.signUp(c));if(error)throw error;
          if(data.session)return afterLogin(data.user);
          note('ok','Account created. Open the confirmation link we emailed you, then sign in.');});
        pw.onkeydown=em.onkeydown=e=>{if(e.key==='Enter')$g('#gxIn').click();};
        $g('#gxBack').onclick=()=>{email=em.value.trim();render('email');};setTimeout(()=>(em.value?pw:em).focus(),60);}
    }
    render('email');
    if(!sb)netProblem();
  });
}

/* ---- account chip (backup / sign out; offers sign-in again only if you skipped it) ---- */
const chip=document.createElement('button');
chip.className='tf-b tf-acct';
chip.style.cssText='display:none;position:fixed;left:14px;bottom:calc(14px + var(--safe-b));z-index:99990;font-size:12.5px;border-radius:999px';
document.body.appendChild(chip);
let chipUser=null;
function showChip(){
  if(gateOpen)return;
  if(chipUser){chip.textContent='\u2601\ufe0f '+chipUser.email.split('@')[0];chip.style.display='';}
  else if(sessionStorage.getItem('tf_offline')==='1'){chip.textContent='Sync is off \u00b7 Sign in';chip.style.display='';}
  else chip.style.display='none';}
chip.onclick=()=>{
  if(!chipUser){sessionStorage.removeItem('tf_offline');chip.style.display='none';showGate();return;}
  const ov=document.createElement('div');ov.className='tf-ov';
  ov.innerHTML='<div class="tf-box" style="width:min(360px,100%)"><button class="tf-x">\u2715</button><h3 style="margin:0 0 4px">Account</h3><p class="em" style="margin:0 0 14px;color:var(--muted);font-size:13px"></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="tf-b p" id="mBk">Back up now</button><button class="tf-b" id="mOut">Sign out</button></div></div>';
  ov.querySelector('.em').textContent=chipUser.email;
  document.body.appendChild(ov);
  ov.querySelector('.tf-x').onclick=()=>ov.remove();
  ov.addEventListener('mousedown',e=>{if(e.target===ov)ov.remove();});
  ov.querySelector('#mBk').onclick=async()=>{await window.tfBackupNow(false);ov.remove();};
  ov.querySelector('#mOut').onclick=async()=>{await window.tfBackupNow(true);await sb.auth.signOut();ov.remove();};
};

if(sb)sb.auth.onAuthStateChange((event,session)=>{
  chipUser=session&&session.user?session.user:null;
  if(chipUser){showChip();return;}
  chip.style.display='none';
  if(event==='SIGNED_OUT'){syncReady=false;setTimeout(showGate,0);}
});
setInterval(()=>window.tfBackupNow(true), 120000);      // auto-backup every 2 min (only once sync is ready)
window.addEventListener('beforeunload',()=>window.tfBackupNow(true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')window.tfBackupNow(true);});

/* ---- first-open check ---- */
(async()=>{
  const stored=()=>Object.keys(localStorage).some(k=>/^sb-.+-auth-token$/.test(k));
  let s=null;
  if(sb)try{s=(await withTimeout(sb.auth.getSession(),8000)).data.session;}catch(e){}
  if(s||(sb&&stored()&&!navigator.onLine)){
    chipUser=s?s.user:null;syncReady=!!s;
    document.documentElement.classList.remove('tf-lock');showChip();
  }else if(sessionStorage.getItem('tf_offline')==='1'){
    document.documentElement.classList.remove('tf-lock');showChip();
  }else{ await showGate(); }
})();
</script>
